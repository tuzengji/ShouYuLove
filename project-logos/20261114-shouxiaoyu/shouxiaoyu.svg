  <g stroke="#4b5d54" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 主暖米对话气泡 -->
    <path d="M36 74 Q36 40 70 40 H166 Q200 40 200 74 V138 Q200 172 166 172 H98 L62 199 V172 Q36 168 36 138 Z" fill="#f5e6d6"/>
