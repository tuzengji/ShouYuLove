    <circle cx="154" cy="181" r="5" fill="#4b5d54" stroke="none"/>
    <circle cx="173" cy="181" r="5" fill="#4b5d54" stroke="none"/>
    <circle cx="192" cy="181" r="5" fill="#4b5d54" stroke="none"/>
    <!-- 右上角暖金晨星 -->
    <path d="M214 24 Q216 42 234 44 Q216 46 214 64 Q212 46 194 44 Q212 42 214 24 Z" fill="#e7c589" stroke-width="9"/>
  </g>
</svg>
