<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">手语视听说 · 视频台词与对话泡</title>
  <g stroke="#4b5d54" stroke-linecap="round" stroke-linejoin="round">
    <!-- 主视频画面卡片（奶油底 + 底部灰绿字幕带） -->
    <rect x="28" y="80" width="172" height="136" rx="26" fill="#ece2cf" stroke="none"/>
    <path d="M28 166 H200 V190 Q200 216 174 216 H54 Q28 216 28 190 Z" fill="#aec2b1" stroke="none"/>
    <rect x="28" y="80" width="172" height="136" rx="26" fill="none" stroke-width="13"/>
    <path d="M30 166 H198" fill="none" stroke-width="11"/>
    <!-- 底部字幕对照短横与定位圆点 -->
