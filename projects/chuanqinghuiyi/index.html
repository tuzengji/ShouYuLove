lay:none}</style><main class="static-preview"><h1>以手予爱<br/>ShouYuLove</h1><p>我们是北京大学爱心社手语分社心创组</p><p>以手予爱 ShouYuLove 是我们心创组推出的作品系列名称，也是我们的追寻。</p><h2>梦想</h2><p>以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>愿景</h2><p>心创组致力于用人工智能技术服务手语分社与无障碍事业：让手语学习变得更有趣，让分社的知识与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>以手寻语 SignTrace</h2><p>描述你看到的手语动作，查出对应词义。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/signtrace/">进入以手寻语 SignTrace</a><p>设计者：涂增基 朱星晔 王宁静 黄庭逸</p><h2>分社手语词典</h2><p>按词语或动作查的国家通用手语词典。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/dict">进入分社手语词典</a><p>设计者：朱星晔</p><h2>小爱同学的物资小屋</h2><p>爱心社物资与社办储物间管理系统。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/XiaoAi-Warm-Cabin/">进入小爱同学的物资小屋</a><p>设计者：黄庭逸</p><h2>手语视听说</h2><p>看电影片段和手语短片，逐句对照学手语。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/shouyu-shitingshuo/">进入手语视听说</a><p>设计者：李昌昊</p><h2>手小语</h2><p>常驻分社微信群的陪伴伙伴，陪聊也陪猜手语。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/shouxiaoyu/">认识手小语</a><p>设计者：涂增基</p><h2>2026 手语文化节</h2><p>服务于 2026 年手语文化节的小游戏网页～</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/2026-sign-language-cultural-festival/">打开2026 手语文化节</a><p>设计者：周丽敏 涂增基 黄庭逸</p><h2>2026 手语分社骨干年终总结</h2><p>为 22 届骨干们献上的年终总结，这一年你们辛苦了！</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/2026-year-end-summary/">进入 2026 手语分社骨干年终总结</a><p>设计者：涂增基 黄庭逸 潘婧欣 王宁静 叶子涵</p><h2>骷髅牌</h2><p>多人联机手语牌桌，用玫瑰和骷髅试探并放技能。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/skull/">进入骷髅牌</a><p>设计者：黄庭逸</p><h2>完美一餐</h2><p>手语点菜合作游戏，避开忌口凑出一桌爱吃的菜。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/perfectmenu/">进入完美一餐</a><p>设计者：黄雨琦</p><h2>奶家麻将</h2><p>玩奶麻需要经常点击屏幕，有助于锻炼手指灵活性，可以提高手语能力。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/NaiMahjong/">进入奶家麻将</a><p>设计者：王宁静</p><h2>指间趣游 SignPlay</h2><p>手语小游戏手册，按场景和难度查玩法和资料。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/signplay/">进入指间趣游</a><p>设计者：伍家阳</p><h2>飞手传书</h2><p>比划猜词的共享题库，可分类抽题也能一起加词。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/flyinghands/">进入飞手传书</a><p>设计者：王宁静</p><h2>传情会意-手语版</h2><p>和伙伴轮流比划猜词，按难度练手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/chuanqinghuiyi/">开始传情会意</a><p>设计者：涂增基</p><h2>炸飞机</h2><p>两队藏好飞机，轮流打手语报坐标找机头。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/bombplane/">进入炸飞机</a><p>设计者：伍家阳</p><h2>水果炸弹</h2><p>轮流打蔬果手语算颜色，触发隐藏技能。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/fruitbomb/">进入水果炸弹</a><p>设计者：伍家阳</p><h2>巴巴爸爸</h2><p>配节奏视频的现场主持台，用来分组闯关猜身份。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/barbapapa/">进入巴巴爸爸</a><p>设计者：伍家阳</p><h2>行动代号</h2><p>手语版 Codenames，两队看手语线索猜词。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/codenames/">进入行动代号</a><p>设计者：伍家阳</p><h2>雪豹凶杀案</h2><p>手语地图推理游戏，轮流查线索找真相。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/snowleopard/">进入雪豹凶杀案</a><p>设计者：伍家阳</p><h2>去哪自习</h2><p>查询空闲教室，按时间和教学楼安排自习。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/where-to-study/">进入去哪自习</a><p>设计者：王宁静</p><h2>拼好课</h2><p>搜索北大课程，收藏并排出自己的课表。</p><a target="_blank" rel="noopener noreferrer" href="https://pinhaoke.love">打开拼好课</a><p>设计者：涂增基</p><h2>北大知道 PKU Know</h2><p>第一时间一站式了解北大的所有动态。</p><a target="_blank" rel="noopener noreferrer" href="https://pkuknow.cn">打开北大知道 PKU Know</a><p>设计者：涂增基</p><h2>清华知道 THU Know</h2><p>第一时间一站式了解清华的所有动态。</p><a target="_blank" rel="noopener noreferrer" href="https://pkuknow.cn/thu">打开清华知道 THU Know</a><p>设计者：涂增基</p><h2>接锅</h2><p>发布项目，自由接锅，一起把想法做出来。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/catchpot/">打开接锅</a><p>设计者：心创组</p><h2>手语分社统一通行证</h2><p>分社统一账号，一次登录通行各项目。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/auth/dev">进入手语分社统一通行证</a><p>设计者：涂增基</p><h2>心创云盘</h2><p>心创组内部共享网盘，登录后在线管理文件。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/drive/">进入心创云盘</a><p>设计者：涂增基</p><h2>边界</h2><p>为手语分社，为无障碍事业服务。坚守公益本心。</p><p>对他人创作 / 知识产权负责。不擅自把他人的原创内容投喂给 AI 做训练、改写或风格模仿</p><p>对隐私 / 数据安全负责。对数据进行脱敏后使用和发布。</p><h2>心创组第一届成员</h2><p>涂增基　朱星晔　王宁静　黄庭逸　李昌昊　刘思昊　张志成　黄雨琦　伍家阳　王可遇　张诗茵　李咏翼　曹前走</p></main></noscript></div><script data-ssr="true" id="__NUXT_DATA__" type="application/json">[{"state":1,"once":2,"_errors":3,"serverRendered":6,"path":7,"pinia":8,"prerenderedAt":2504,"data":2505},{},["Set"],["Reactive",4],{"en_page_projects_chuanqinghuiyi":5},null,false,"/projects/chuanqinghuiyi/",{"transition":9,"ui":39,"webgl":92,"datas":112,"scroll":2492},{"pageTransitions":10,"layoutTransitions":11,"cancelCallbacks":12,"meta":15,"transitionState":38},["Map"],["Map"],{"page":13,"layout":14},null,null,{"from":16,"to":27},{"fullPath":17,"path":18,"hash":19,"name":20,"params":21,"meta":24,"href":26},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":22,"id":23},"projects","louis-vuitton-1",{"layout":25},"default","/projects/louis-vuitton-1/",{"fullPath":28,"path":29,"hash":30,"name":31,"params":32,"meta":35,"href":37},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":33,"id":34},"projects","louis-vuitton-1",{"layout":36},"default","/projects/louis-vuitton-1/","none",{"isFirstRoute":40,"currentRoute":41,"previousRoute":42,"routesHistory":43,"previousRouteName":44,"mainLoader":45,"buttons":53,"bg":62,"windowSize":68,"debugParams":71,"popin":73,"audio":77,"cursor":79,"navButtonType":84,"isFooterInViewport":85,"isFooterBottomReached":86,"isInFastMode":87,"firstUserScroll":88,"uiHovered":89,"newsletterIsOpen":90,"introLoaderVisible":91},true,null,null,[],null,{"visible":46,"loaded":47,"progressComplete":48,"hideStart":49,"hideCompl
