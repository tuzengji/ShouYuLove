""><div data-v-0b3c665a=""><div data-v-0b3c665a="">0</div></div></div></div></div><div id="__nuxt"><noscript><style>#boot-loader{display:none}</style><main class="static-preview"><h1>以手予爱<br/>ShouYuLove</h1><p>我们是北京大学爱心社手语分社心创组</p><p>以手予爱 ShouYuLove 是我们心创组推出的作品系列名称，也是我们的追寻。</p><h2>梦想</h2><p>以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>愿景</h2><p>心创组致力于用人工智能技术服务手语分社与无障碍事业：让手语学习变得更有趣，让分社的知识与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>以手寻语 SignTrace</h2><p>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/signtrace/">进入以手寻语 SignTrace</a><p>设计者：涂增基 朱星晔 王宁静 黄庭逸</p><h2>分社手语词典</h2><p>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/dict">进入分社手语词典</a><p>设计者：朱星晔</p><h2>手小语</h2><p>常驻手语分社微信群的陪伴伙伴，日常陪大家聊天水群、接梗斗图，空闲时也一起玩看图猜手语。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/shouxiaoyu/">认识手小语</a><p>设计者：涂增基</p><h2>2026 手语文化节</h2><p>服务于 2026 年手语文化节的小游戏网页～</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/2026-sign-language-cultural-festival/">打开2026 手语文化节</a><p>设计者：周丽敏 涂增基 黄庭逸</p><h2>2026 手语分社骨干年终总结</h2><p>为 22 届骨干们献上的年终总结，这一年你们辛苦了！</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/2026-year-end-summary/">进入 2026 手语分社骨干年终总结</a><p>设计者：涂增基 黄庭逸 潘婧欣 王宁静 叶子涵</p><h2>指间趣游 SignPlay</h2><p>手语小游戏手册，按活动类型与难度查找玩法，并提供人数、时长和原始资料。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/signplay/">进入指间趣游</a><p>设计者：伍家阳</p><h2>飞手传书</h2><p>为你比划我猜和传词游戏准备的共享素材库，支持分类选题、随机抽题、素材共建与导入导出。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/flyinghands/">进入飞手传书</a><p>设计者：王宁静</p><h2>传情会意-手语版</h2><p>和伙伴轮流比划、猜词，通过不同难度的题目练习手语表达，让学习与社团活动更有趣。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/chuanqinghuiyi/">开始传情会意</a><p>设计者：涂增基</p><h2>炸飞机</h2><p>两队秘密布局机位，轮流打手语汇报格点坐标搜寻机头；提供主持人控场台与玩家观众盘。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/bombplane/">进入炸飞机</a><p>设计者：伍家阳</p><h2>水果炸弹</h2><p>轮流打出蔬果手语进行颜色运算，触发隐藏技能与逆转效果；提供主持人台与玩家技能表。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/fruitbomb/">进入水果炸弹</a><p>设计者：伍家阳</p><h2>巴巴爸爸</h2><p>配合《巴巴爸爸》素材与节奏挑战视频的现场主持台，支持分组、闯关、提问与身份猜测。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/barbapapa/">进入巴巴爸爸</a><p>设计者：伍家阳</p><h2>行动代号</h2><p>手语版 Codenames 现场主持人台，两队由组长用手语词与数字给出线索，猜词盖牌对抗。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/codenames/">进入行动代号</a><p>设计者：伍家阳</p><h2>雪豹凶杀案</h2><p>现场互动地图与线索推理主持人台，大家轮流用手语调查家具与工具，在有限机会中还原真相。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/snowleopard/">进入雪豹凶杀案</a><p>设计者：伍家阳</p><h2>去哪自习</h2><p>查询空闲教室，按时间和教学楼安排自习。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/where-to-study/">进入去哪自习</a><p>设计者：王宁静</p><h2>拼好课</h2><p>搜索和筛选北大课程，查看课程详情，收藏感兴趣的课程，并整理、导出自己的课表。</p><a target="_blank" rel="noopener noreferrer" href="https://pinhaoke.love">打开拼好课</a><p>设计者：涂增基</p><h2>北大知道 PKU Know</h2><p>为你消除信息差，第一时间一站式了解北大的所有动态。</p><a target="_blank" rel="noopener noreferrer" href="https://pkuknow.cn">打开北大知道 PKU Know</a><p>设计者：涂增基</p><h2>清华知道 THU Know</h2><p>为你消除信息差，第一时间一站式了解清华的所有动态。</p><a target="_blank" rel="noopener noreferrer" href="https://pkuknow.cn/thu">打开清华知道 THU Know</a><p>设计者：涂增基</p><h2>接锅</h2><p>发布项目，自由接锅，一起把想法做出来。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/catchpot/">打开接锅</a><p>设计者：心创组</p><h2>手语分社统一通行证</h2><p>分社统一账号与单点登录服务，支持手机号验证码自动注册与各项目自助接入。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/auth/dev">进入手语分社统一通行证</a><p>设计者：涂增基</p><h2>心创云盘</h2><p>心创组内部共享网盘与智能协作空间，支持统一通行证登录、网页端文件管理与服务器直接读写。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/drive/">进入心创云盘</a><p>设计者：涂增基</p><h2>边界</h2><p>为手语分社，为无障碍事业服务。坚守公益本心。</p><p>对他人创作 / 知识产权负责。不擅自把他人的原创内容投喂给 AI 做训练、改写或风格模仿</p><p>对隐私 / 数据安全负责。对数据进行脱敏后使用和发布。</p><h2>心创组第一届成员</h2><p>涂增基　朱星晔　王宁静　黄庭逸　李昌昊　刘思昊　张志成　黄雨琦　伍家阳　王可遇　张诗茵　李咏翼　曹前走</p></main></noscript></div><script data-ssr="true" id="__NUXT_DATA__" type="application/json">[{"state":1,"once":2,"_errors":3,"serverRendered":6,"path":7,"pinia":8,"prerenderedAt":2108,"data":2109},{},["Set"],["Reactive",4],{"en_page_projects_signplay":5},null,false,"/projects/signplay/",{"transition":9,"ui":39,"webgl":92,"datas":112,"scroll":2096},{"pageTransitions":10,"layoutTransitions":11,"cancelCallbacks":12,"meta":15,"transitionState":38},["Map"],["Map"],{"page":13,"layout":14},null,null,{"from":16,"to":27},{"fullPath":17,"path":18,"hash":19,"name":20,"params":21,"meta":24,"href":26},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":22,"id":23},"projects","louis-vuitton-1",{"layout":25},"default","/projects/louis-vuitton-1/",{"fullPath":28,"path":29,"hash":30,"name":31,"params":32,"meta":35,"href":37},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":33,"id":34},"projects","louis-vuitton-1",{"layout":36},"default","/projects/louis-vuitton-1/","none",{"isFirstRoute":40,"currentRoute":41,"previousRoute":42,"routesHistory":43,"previousRouteName":44,"mainLoader":45,"buttons":53,"bg":62,"windowSize":68,"debugParams":71,"popin":73,"audio":77,"cursor":79,"navButtonType":84,"isFooterInViewport":85,"isFooterBottomReached":86,"isInFastMode":87,"firstUserScroll":88,"uiHovered":89,"newsletterIsOpen":90,"introLoaderVisible":91},true,null,null,[],null,{"visible":46,"loaded":47,"progressComplete":48,"hideStart":49,"hideComplete":50,"hideOnComplete":51,"pageTopMargin":52},true,false,false,false,false,null,0,{"backBttn":54,"nextBttn":58},{"url":55,"label":56,"labelHover":57},null,null,null,{"url":59,"label":60,"labelHover":61},null,null,null,{"color":63,"dark":64,"transition":65},"white",false,{"duration":66,"ease":67},0,null,{"width":69,"height":70},0,0,{"debugDom":72},false,{ null,"center-right","medium","default",null,{"type":1453,"text1":1454,"text2":1455,"align":1456,"text1Size":1457,"text1Layout":1458,"titleSection":1459},"text","愿景\u003cbr/>\u003cbr/>心创组致力于用人工智能技术服务手语分社与无障碍事业：让手语学习变得更有趣，让分社的知识与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。",null,"center-left","medium","default",null,{"type":1461,"title":1462,"slug":1463,"uri":1464,"url":1465,"loaded":1466,"loading":1467,"metas":1468,"sceneIndex":1469,"blocks":1470},"about-detail","梦想","our-approach","the-studio/our-approach","/the-studio/our-approach/",true,false,null,2,[1471],{"type":1472,"text1":1473,"text2":1474,"align":1475,"text1Size":1476,"text1Layout":1477,"titleSection":1478},"text","以手予爱，用心创造。让每一个好的想法，都抵达需要的人。",null,"center-left","medium","default",null,{"type":1480,"title":1481,"slug":1482,"uri":1483,"url":1484,"loaded":1485,"loading":1486,"metas":1487,"sceneIndex":1488,"blocks":1489},"about-detail","核心创意","services","the-studio/services","/the-studio/services/",true,false,null,3,[1490,1498,1506,1514,1522,1530],{"type":1491,"text1":1492,"text2":1493,"align":1494,"text1Size":1495,"text1Layout":1496,"titleSection":1497},"text","围绕手语学习与表达，探索常用工具、互动游戏和无障碍交流。",null,"center-left","medium","default",null,{"type":1499,"text1":1500,"text2":1501,"align":1502,"text1Size":1503,"text1Layout":1504,"titleSection":1505},"text","以手寻语 SignTrace\u003cbr/>\u003cbr/>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。\u003cbr/>\u003ca href=\"https://shouyulove.cn/signtrace/\" target=\"_blank\" rel=\"noopener noreferrer\">进入以手寻语 SignTrace\u003c/a>\u003cbr/>设计者：涂增基 朱星晔 王宁静 黄庭逸",null,"center-right","medium","default",null,{"type":1507,"text1":1508,"text2":1509,"align":1510,"text1Size":1511,"text1Layout":1512,"titleSection":1513},"text","分社手语词典\u003cbr/>\u003cbr/>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。\u003cbr/>\u003ca href=\"https://shouyulove.cn/dict\" target=\"_blank\" rel=\"noopener noreferrer\">进入分社手语词典\u003c/a>\u003cbr/>设计者：朱星晔"
