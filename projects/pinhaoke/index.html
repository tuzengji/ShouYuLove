程，查看课程详情，收藏感兴趣的课程，并整理、导出自己的课表。</p><a href="https://pinhaoke.love" rel="noopener noreferrer" target="_blank">打开拼好课</a><p>设计者：涂增基</p><h2>北大知道 PKU Know</h2><p>为你消除信息差，第一时间一站式了解北大的所有动态。</p><a href="https://pkuknow.cn" rel="noopener noreferrer" target="_blank">打开北大知道 PKU Know</a><p>设计者：涂增基</p><h2>清华知道 THU Know</h2><p>为你消除信息差，第一时间一站式了解清华的所有动态。</p><a href="https://pkuknow.cn/thu" rel="noopener noreferrer" target="_blank">打开清华知道 THU Know</a><p>设计者：涂增基</p><h2>接锅</h2><p>发布项目，自由接锅，一起把想法做出来。</p><a href="https://shouyulove.cn/catchpot/" rel="noopener noreferrer" target="_blank">打开接锅</a><p>设计者：心创组</p><h2>边界</h2><p>为手语分社，为无障碍事业服务。坚守公益本心。</p><p>对他人创作 / 知识产权负责。不擅自把他人的原创内容投喂给 AI 做训练、改写或风格模仿</p><p>对隐私 / 数据安全负责。对数据进行脱敏后使用和发布。</p><h2>心创组第一届成员</h2><p>涂增基　朱星晔　王宁静　黄庭逸　李昌昊　刘思昊　张志成　黄雨琦　伍家阳　王可遇　张诗茵　李咏翼　曹前走</p></main></noscript></div><script data-ssr="true" id="__NUXT_DATA__" type="application/json">[{"state":1,"once":3,"_errors":4,"serverRendered":7,"path":8,"pinia":9,"prerenderedAt":1087,"data":1088},["Reactive",2],{},["Set"],["Reactive",5],{"en_page_projects_pinhaoke":6},null,false,"/projects/pinhaoke/",{"transition":10,"ui":40,"webgl":93,"datas":113,"scroll":1075},{"pageTransitions":11,"layoutTransitions":12,"cancelCallbacks":13,"meta":16,"transitionState":39},["Map"],["Map"],{"page":14,"layout":15},null,null,{"from":17,"to":28},{"fullPath":18,"path":19,"hash":20,"name":21,"params":22,"meta":25,"href":27},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":23,"id":24},"projects","louis-vuitton-1",{"layout":26},"default","/projects/louis-vuitton-1/",{"fullPath":29,"path":30,"hash":31,"name":32,"params":33,"meta":36,"href":38},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":34,"id":35},"projects","louis-vuitton-1",{"layout":37},"default","/projects/louis-vuitton-1/","none",{"isFirstRoute":41,"currentRoute":42,"previousRoute":43,"routesHistory":44,"previousRouteName":45,"mainLoader":46,"buttons":54,"bg":63,"windowSize":69,"
