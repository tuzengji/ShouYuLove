c665a=""><div data-v-0b3c665a=""><div data-v-0b3c665a="">0</div></div></div></div></div><div id="__nuxt"><noscript><style>#boot-loader{display:none}</style><main class="static-preview"><h1>以手予爱<br/>ShouYuLove</h1><p>我们是北京大学爱心社手语分社心创组</p><p>以手予爱 ShouYuLove 是我们心创组推出的作品系列名称，也是我们的追寻。</p><h2>梦想</h2><p>以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>愿景</h2><p>心创组致力于用人工智能技术服务手语分社与无障碍事业：让手语学习变得更有趣，让分社的知识与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>以手寻语 SignTrace</h2><p>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/signtrace/">进入以手寻语 SignTrace</a><p>设计者：涂增基 朱星晔 王宁静 黄庭逸</p><h2>分社手语词典</h2><p>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/dict">进入分社手语词典</a><p>设计者：朱星晔</p><h2>手小语</h2><p>常驻手语分社微信群的陪伴伙伴，日常陪大家聊天水群、接梗斗图，空闲时也一起玩看图猜手语。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/shouxiaoyu/">认识手小语</a><p>设计者：涂增基</p><h2>2026 手语文化节</h2><p>服务于 2026 年手语文化节的小游戏网页～</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/2026-sign-language-cultural-festival/">打开2026 手语文化节</a><p>设计者：周丽敏 涂增基 黄庭逸</p><h2>2026 手语分社骨干年终总结</h2><p>为 22 届骨干们献上的年终总结，这一年你们辛苦了！</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/2026-year-end-summary/">进入 2026 手语分社骨干年终总结</a><p>设计者：涂增基 黄庭逸 潘婧欣 王宁静 叶子涵</p><h2>指间趣游 SignPlay</h2><p>手语小游戏手册，按活动类型与难度查找玩法，并提供人数、时长和原始资料。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/signplay/">进入指间趣游</a><p>设计者：伍家阳</p><h2>飞手传书</h2><p>为你比划我猜和传词游戏准备的共享素材库，支持分类选题、随机抽题、素材共建与导入导出。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/flyinghands/">进入飞手传书</a><p>设计者：王宁静</p><h2>传情会意-手语版</h2><p>和伙伴轮流比划、猜词，通过不同难度的题目练习手语表达，让学习与社团活动更有趣。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/chuanqinghuiyi/">开始传情会意</a><p>设计者：涂增基</p><h2>去哪自习</h2><p>查询空闲教室，按时间和教学楼安排自习。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/where-to-study/">进入去哪自习</a><p>设计者：王宁静</p><h2>拼好课</h2><p>搜索和筛选北大课程，查看课程详情，收藏感兴趣的课程，并整理、导出自己的课表。</p><a target="_blank" rel="noopener noreferrer" href="https://pinhaoke.love">打开拼好课</a><p>设计者：涂增基</p><h2>北大知道 PKU Know</h2><p>为你消除信息差，第一时间一站式了解北大的所有动态。</p><a target="_blank" rel="noopener noreferrer" href="https://pkuknow.cn">打开北大知道 PKU Know</a><p>设计者：涂增基</p><h2>清华知道 THU Know</h2><p>为你消除信息差，第一时间一站式了解清华的所有动态。</p><a target="_blank" rel="noopener noreferrer" href="https://pkuknow.cn/thu">打开清华知道 THU Know</a><p>设计者：涂增基</p><h2>接锅</h2><p>发布项目，自由接锅，一起把想法做出来。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/catchpot/">打开接锅</a><p>设计者：心创组</p><h2>手语分社统一通行证</h2><p>分社统一账号与单点登录服务，支持手机号验证码自动注册与各项目自助接入。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/auth/dev">进入手语分社统一通行证</a><p>设计者：涂增基</p><h2>心创云盘</h2><p>心创组内部共享网盘与智能协作空间，支持统一通行证登录、网页端文件管理与服务器直接读写。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/drive/">进入心创云盘</a><p>设计者：涂增基</p><h2>边界</h2><p>为手语分社，为无障碍事业服务。坚守公益本心。</p><p>对他人创作 / 知识产权负责。不擅自把他人的原创内容投喂给 AI 做训练、改写或风格模仿</p><p>对隐私 / 数据安全负责。对数据进行脱敏后使用和发布。</p><h2>心创组第一届成员</h2><p>涂增基　朱星晔　王宁静　黄庭逸　李昌昊　刘思昊　张志成　黄雨琦　伍家阳　王可遇　张诗茵　李咏翼　曹前走</p></main></noscript></div><script data-ssr="true" id="__NUXT_DATA__" type="application/json">[{"state":1,"once":2,"_errors":3,"serverRendered":5,"path":6,"pinia":7,"prerenderedAt":1727,"data":1728},{},["Set"],{"en_page_projects_shouxiaoyu":4},null,false,"/projects/shouxiaoyu/",{"transition":8,"ui":38,"webgl":91,"datas":111,"scroll":1715},{"pageTransitions":9,"layoutTransitions":10,"cancelCallbacks":11,"meta":14,"transitionState":37},["Map"],["Map"],{"page":12,"layout":13},null,null,{"from":15,"to":26},{"fullPath":16,"path":17,"hash":18,"name":19,"params":20,"meta":23,"href":25},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":21,"id":22},"projects","louis-vuitton-1",{"la
