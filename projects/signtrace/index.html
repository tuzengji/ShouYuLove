"introLoader__scrollDown" data-v-0b3c665a=""><div data-v-0b3c665a=""><div data-v-0b3c665a="">0</div></div></div></div></div><div id="__nuxt"><noscript><style>#boot-loader{display:none}</style><main class="static-preview"><h1>以手予爱<br/>ShouYuLove</h1><p>我们是北京大学爱心社手语分社心创组</p><p>以手予爱 ShouYuLove 是我们心创组推出的作品系列名称，也是我们的追寻。</p><h2>梦想</h2><p>以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>愿景</h2><p>心创组致力于用人工智能技术服务手语分社与无障碍事业：让手语学习变得更有趣，让分社的知识与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>以手寻语 SignTrace</h2><p>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。</p><a href="https://shouyulove.cn/signtrace/" rel="noopener noreferrer" target="_blank">进入以手寻语 SignTrace</a><p>设计者：涂增基 朱星晔 王宁静 黄庭逸</p><h2>分社手语词典</h2><p>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。</p><a href="https://shouyulove.cn/dict" rel="noopener noreferrer" target="_blank">进入分社手语词典</a><p>设计者：朱星晔</p><h2>传情会意-手语版</h2><p>和伙伴轮流比划、猜词，通过不同难度的题目练习手语表达，让学习与社团活动更有趣。</p><a href="https://shouyulove.cn/chuanqinghuiyi/" rel="noopener noreferrer" target="_blank">开始传情会意</a><p>设计者：涂增基</p><h2>指间趣游 SignPlay</h2><p>手语小游戏手册，按活动类型与难度查找玩法，并提供人数、时长和原始资料。</p><a href="https://shouyulove.cn/signplay/" rel="noopener noreferrer" target="_blank">进入指间趣游</a><p>设计者：伍家阳</p><h2>飞手传书</h2><p>为你比划我猜和传词游戏准备的共享素材库，支持分类选题、随机抽题、素材共建与导入导出。</p><a href="https://shouyulove.cn/flyinghands/" rel="noopener noreferrer" target="_blank">进入飞手传书</a><p>设计者：王宁静</p><h2>2026 手语文化节</h2><p>服务于 2026 年手语文化节的小游戏网页～</p><a href="https://shouyulove.cn/2026-sign-language-cultural-festival/" rel="noopener noreferrer" target="_blank">打开2026 手语文化节</a><p>设计者：周丽敏 涂增基 黄庭逸</p><h2>2026 手语分社骨干年终总结</h2><p>为 22 届骨干们献上的年终总结，这一年你们辛苦了！</p><a href="https://shouyulove.cn/2026-year-end-summary/" rel="noopener noreferrer" target="_blank">进入 2026 手语分社骨干年终总结</a><p>设计者：涂增基 黄庭逸 潘婧欣 王宁静 叶子涵</p><h2>去哪自习</h2><p>查询空闲教室，按时间和教学楼安排自习。</p><a href="https://shouyulove.cn/where-to-study/" rel="noopener noreferrer" target="_blank">进入去哪自习</a><p>设计者：王宁静</p><h2>拼好课</h2><p>搜索和筛选北大课程，查看课程详情，收藏感兴趣的课程，并整理、导出自己的课表。</p><a href="https://pinhaoke.love" rel="noopener noreferrer" target="_blank">打开拼好课</a><p>设计者：涂增基</p><h2>北大知道 PKU Know</h2><p>为你消除信息差，第一时间一站式了解北大的所有动态。</p><a href="https://pkuknow.cn" rel="noopener noreferrer" target="_blank">打开北大知道 PKU Know</a><p>设计者：涂增基</p><h2>清华知道 THU Know</h2><p>为你消除信息差，第一时间一站式了解清华的所有动态。</p><a href="https://pkuknow.cn/thu" rel="noopener noreferrer" target="_blank">打开清华知道 THU Know</a><p>设计者：涂增基</p><h2>接锅</h2><p>发布项目，自由接锅，一起把想法做出来。</p><a href="https://shouyulove.cn/catchpot/" rel="noopener noreferrer" target="_blank">打开接锅</a><p>设计者：心创组</p><h2>边界</h2><p>为手语分社，为无障碍事业服务。坚守公益本心。</p><p>对他人创作 / 知识产权负责。不擅自把他人的原创内容投喂给 AI 做训练、改写或风格模仿</p><p>对隐私 / 数据安全负责。对数据进行脱敏后使用和发布。</p><h2>心创组第一届成员</h2><p>涂增基　朱星晔　王宁静　黄庭逸　李昌昊　刘思昊　张志成　黄雨琦　伍家阳　王可遇　张诗茵　李咏翼　曹前走</p></main></noscript></div><script data-ssr="true" id="__NUXT_DATA__" type="application/json">[{"state":1,"once":3,"_errors":4,"serverRendered":7,"path":8,"pinia":9,"prerenderedAt":1507,"data":1508},["Reactive",2],{},["Set"],["Reactive",5],{"en_page_projects_signtrace":6},null,false,"/projects/signtrace/",{"transition":10,"ui":40,"webgl":93,"datas":113,"scroll":1495},{"pageTransitions":11,"layoutTransitions":12,"cancelCallbacks":13,"meta":16,"transitionState":39},["Map"],["Map"],{"page":14,"layout":15},null,null,{"from":17,"to":28},{"fullPath":18,"path":19,"hash":20,"name":21,"params":22,"meta":25,"href":27},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":23,"id":24},"projects","louis-vuitton-1",{"layout":26},"default","/projects/louis-vuitton-1/",{"fullPath":29,"path":30,"hash":31,"name":32,"params":33,"meta":36,"href":38},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":34,"id":35},"projects","louis-vuitton-1",{"layout":37},"default","/projects/louis-vuitton-1/","none",{"isFirstRoute":41,"currentRoute":42,"previousRoute":43,"routesHistory":44,"previousRouteName":45,"mainLoader":46,"buttons":54,"bg": 1024},"text","围绕手语学习与表达，探索常用工具、互动游戏和无障碍交流。",null,"center-left","medium","default",null,{"type":1026,"text1":1027,"text2":1028,"align":1029,"text1Size":1030,"text1Layout":1031,"titleSection":1032},"text","以手寻语 SignTrace\u003cbr/>\u003cbr/>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。\u003cbr/>\u003ca href=\"https://shouyulove.cn/signtrace/\" target=\"_blank\" rel=\"noopener noreferrer\">进入以手寻语 SignTrace\u003c/a>\u003cbr/>设计者：涂增基 朱星晔 王宁静 黄庭逸",null,"center-right","medium","default",null,{"type":1034,"text1":1035,"text2":1036,"align":1037,"text1Size":1038,"text1Layout":1039,"titleSection":1040},"text","分社手语词典\u003cbr/>\u003cbr/>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。\u003cbr/>\u003ca href=\"https://shouyulove.cn/dict\" target=\"_blank\" rel=\"noopener noreferrer\">进入分社手语词典\u003c/a>\u003cbr/>设计者：朱星晔",null,"center-left","medium","default",null,{"type":1042,"text1":1043,"text2":1044,"align":1045,"text1Size":1046,"text1Layout":1047,"titleSection":1048},"text","传情会意-手语版\u003cbr/>\u003cbr/>和伙伴轮流比划、猜词，通过不同难度的题目练习手语表达，让学习与社团活动更有趣。\u003cbr/>\u003ca href=\"https://shouyulove.cn/chuanqinghuiyi/\" target=\"_blank\" rel=\"noopener noreferrer\">开始传情会意\u003c/a>\u003cbr/>设计者：涂增基",null,"center-right","medium","default",null,{"type":1050,"text1":1051,"text2":1052,"align":1053,"text1Size":1054,"text1Layout":1055,"titleSection":1056},"text","指间趣游 SignPlay\u003cbr/>\u003cbr/>手语小游戏手册，按活动类型与难度查找玩法，并提供人数、时长和原始资料。\u003cbr/>\u003ca href=\"https://shouyulove.cn/signplay/\" target=\"_blank\" rel=\"noopener noreferrer\">进入指间趣游\u003c/a>\u003cbr/>设计者：伍家阳",null,"center-left","medium","default",null,{"type":1058,"text1":1059,"text2":1060,"align":1061,"text1Size":1062,"text1Layout":1063,"titleSection":1064},"text","飞手传书\u003cbr/>\u003cbr/>为你比划我猜和传词游戏准备的共享素材库，支持分类选题、随机抽题、素材共建与导入导出。\u003cbr/>\u003ca href=\"https://shouyulove.cn/flyinghands/\" target=\"_blank\" rel=\"noopener noreferrer\">进入飞手传书\u003c/a>\u003cbr/>设计者：王宁静",null,"center-right","medium","default",null,{"type":1066,"text1":1067,"text2":1068,"align"
