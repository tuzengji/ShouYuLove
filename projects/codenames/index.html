""><div data-v-0b3c665a=""><div data-v-0b3c665a="">0</div></div></div></div></div><div id="__nuxt"><noscript><style>#boot-loader{display:none}</style><main class="static-preview"><h1>以手予爱<br/>ShouYuLove</h1><p>我们是北京大学爱心社手语分社心创组</p><p>以手予爱 ShouYuLove 是我们心创组推出的作品系列名称，也是我们的追寻。</p><h2>梦想</h2><p>以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>愿景</h2><p>心创组致力于用人工智能技术服务手语分社与无障碍事业：让手语学习变得更有趣，让分社的知识与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>以手寻语 SignTrace</h2><p>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/signtrace/">进入以手寻语 SignTrace</a><p>设计者：涂增基 朱星晔 王宁静 黄庭逸</p><h2>分社手语词典</h2><p>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/dict">进入分社手语词典</a><p>设计者：朱星晔</p><h2>手小语</h2><p>常驻手语分社微信群的陪伴伙伴，日常陪大家聊天水群、接梗斗图，空闲时也一起玩看图猜手语。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/shouxiaoyu/">认识手小语</a><p>设计者：涂增基</p><h2>2026 手语文化节</h2><p>服务于 2026 年手语文化节的小游戏网页～</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/2026-sign-language-cultural-festival/">打开2026 手语文化节</a><p>设计者：周丽敏 涂增基 黄庭逸</p><h2>2026 手语分社骨干年终总结</h2><p>为 22 届骨干们献上的年终总结，这一年你们辛苦了！</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/2026-year-end-summary/">进入 2026 手语分社骨干年终总结</a><p>设计者：涂增基 黄庭逸 潘婧欣 王宁静 叶子涵</p><h2>骷髅牌</h2><p>多人联机手语牌桌，用玫瑰和骷髅试探并放技能。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/games/skull/">进入骷髅牌</a><p>设计者：黄庭逸</p><h2>完美一餐</h2><p>手语点菜合作游戏，避开忌口凑出一桌爱吃的菜。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/games/perfectmenu/">进入完美一餐</a><p>设计者：黄雨琦</p><h2>奶家麻将</h2><p>玩奶麻需要经常点击屏幕，有助于锻炼手指灵活性，可以提高手语能力。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/NaiMahjong/">进入奶家麻将</a><p>设计者：王宁静</p><h2>指间趣游 SignPlay</h2><p>手语小游戏手册，按场景和难度查玩法和资料。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/signplay/">进入指间趣游</a><p>设计者：伍家阳</p><h2>飞手传书</h2><p>比划猜词的共享题库，可分类抽题也能一起加词。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/flyinghands/">进入飞手传书</a><p>设计者：王宁静</p><h2>传情会意-手语版</h2><p>和伙伴轮流比划猜词，按难度练手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/chuanqinghuiyi/">开始传情会意</a><p>设计者：涂增基</p><h2>炸飞机</h2><p>两队藏好飞机，轮流打手语报坐标找机头。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/bombplane/">进入炸飞机</a><p>设计者：伍家阳</p><h2>水果炸弹</h2><p>轮流打蔬果手语算颜色，触发隐藏技能。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/fruitbomb/">进入水果炸弹</a><p>设计者：伍家阳</p><h2>巴巴爸爸</h2><p>配节奏视频的现场主持台，用来分组闯关猜身份。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/barbapapa/">进入巴巴爸爸</a><p>设计者：伍家阳</p><h2>行动代号</h2><p>手语版 Codenames，两队按组长手语线索猜词对抗。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/codenames/">进入行动代号</a><p>设计者：伍家阳</p><h2>雪豹凶杀案</h2><p>手语地图推理游戏，轮流查线索找真相。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/snowleopard/">进入雪豹凶杀案</a><p>设计者：伍家阳</p><h2>去哪自习</h2><p>查询空闲教室，按时间和教学楼安排自习。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/where-to-study/">进入去哪自习</a><p>设计者：王宁静</p><h2>拼好课</h2><p>搜索和筛选北大课程，查看课程详情，收藏感兴趣的课程，并整理、导出自己的课表。</p><a target="_blank" rel="noopener noreferrer" href="https://pinhaoke.love">打开拼好课</a><p>设计者：涂增基</p><h2>北大知道 PKU Know</h2><p>为你消除信息差，第一时间一站式了解北大的所有动态。</p><a target="_blank" rel="noopener noreferrer" href="https://pkuknow.cn">打开北大知道 PKU Know</a><p>设计者：涂增基</p><h2>清华知道 THU Know</h2><p>为你消除信息差，第一时间一站式了解清华的所有动态。</p><a target="_blank" rel="noopener noreferrer" href="https://pkuknow.cn/thu">打开清华知道 THU Know</a><p>设计者：涂增基</p><h2>接锅</h2><p>发布项目，自由接锅，一起把想法做出来。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/catchpot/">打开接锅</a><p>设计者：心创组</p><h2>手语分社统一通行证</h2><p>分社统一账号与单点登录服务，支持手机号验证码自动注册与各项目自助接入。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/auth/dev">进入手语分社统一通行证</a><p>设计者：涂增基</p><h2>心创云盘</h2><p>心创组内部共享网盘与智能协作空间，支持统一通行证登录、网页端文件管理与服务器直接读写。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/drive/">进入心创云盘</a><p>设计者：涂增基</p><h2>边界</h2><p>为手语分社，为无障碍事业服务。坚守公益本心。</p><p>对他人创作 / 知识产权负责。不擅自把他人的原创内容投喂给 AI 做训练、改写或风格模仿</p><p>对隐私 / 数据安全负责。对数据进行脱敏后使用和发布。</p><h2>心创组第一届成员</h2><p>涂增基　朱星晔　王宁静　黄庭逸　李昌昊　刘思昊　张志成　黄雨琦　伍家阳　王可遇　张诗茵　李咏翼　曹前走</p></main></noscript></div><script data-ssr="true" id="__NUXT_DATA__" type="application/json">[{"state":1,"once":2,"_errors":3,"serverRendered":6,"path":7,"pinia":8,"prerenderedAt":2336,"data":2337},{},["Set"],["Reactive",4],{"en_page_projects_codenames":5},null,false,"/projects/codenames/",{"transition":9,"ui":39,"webgl":92,"datas":112,"scroll":2324},{"pageTransitions":10,"layoutTransitions":11,"cancelCallbacks":12,"meta":15,"transitionState":38},["Map"],["Map"],{"page":13,"layout":14},null,null,{"from":16,"to":27},{"fullPath":17,"path":18,"hash":19,"name":20,"params":21,"meta":24,"href":26},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":22,"id":23},"projects","louis-vuitton-1",{"layout":25},"default","/projects/louis-vuitton-1/",{"fullPath":28,"path":29,"hash":30,"name":31,"params":32,"meta":35,"href":37},"/projects/louis-vuitton-1/","/projects/louis-vuitton-1/","","section-id",{"section":33,"id":34},"projects","louis-vuitton-1",{"layout":36},"default","/projects/louis-vuitton-1/","none",{"isFirstRoute":40,"currentRoute":41,"previousRoute":42,"routesHistory":43,"previousRouteName":44,"mainLoader":45,"buttons":53,"bg":62,"windowSize":68,"debugParams":71,"popin":73,"audio":77,"cursor":79,"navButtonType":84,"isFooterInViewport":85,"isFooterBottomReached":86,"isInFastMode":87,"firstUserScroll":88,"uiHovered":89,"newsletterIsOpen":90,"introLoaderVisible":91},true,null,null,[],null,{"visible":46,"loaded":47,"progressComplete":48,"hideStart":49,"hideComplete":50,"hideOnComplete":51,"pageTopMarg ":1615,"text1Layout":1616,"titleSection":1617},"text","我们是北京大学爱心社手语分社心创组",null,"center-left","medium","default",null,{"type":1619,"text1":1620,"text2":1621,"align":1622,"text1Size":1623,"text1Layout":1624,"titleSection":1625},"text","以手予爱 ShouYuLove 是我们心创组推出的作品系列名称，也是我们的追寻。",null,"center-right","medium","default",null,{"type":1627,"text1":1628,"text2":1629,"align":1630,"text1Size":1631,"text1Layout":1632,"titleSection":1633},"text","愿景\u003cbr/>\u003cbr/>心创组致力于用人工智能技术服务手语分社与无障碍事业：让手语学习变得更有趣，让分社的知识与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。",null,"center-left","medium","default",null,{"type":1635,"title":1636,"slug":1637,"uri":1638,"url":1639,"loaded":1640,"loading":1641,"metas":1642,"sceneIndex":1643,"blocks":1644},"about-detail","梦想","our-approach","the-studio/our-approach","/the-studio/our-approach/",true,false,null,2,[1645],{"type":1646,"text1":1647,"text2":1648,"align":1649,"text1Size":1650,"text1Layout":1651,"titleSection":1652},"text","以手予爱，用心创造。让每一个好的想法，都抵达需要的人。",null,"center-left","medium","default",null,{"type":1654,"title":1655,"slug":1656,"uri":1657,"url":1658,"loaded":1659,"loading":1660,"metas":1661,"sceneIndex":1662,"blocks":1663},"about-detail","核心创意","services","the-studio/services","/the-studio/services/",true,false,null,3,[1664,1672,1680,1688,1696,1704],{"type":1665,"text1":1666,"text2":1667,"align":1668,"text1Size":1669,"text1Layout":1670,"titleSection":1671},"text","围绕手语学习与表达，探索常用工具、互动游戏和无障碍交流。",null,"center-left","medium","default",null,{"type":1673,"text1":1674,"text2":1675,"align":1676,"text1Size":1677,"text1Layout":1678,"titleSection":1679},"text","以手寻语 SignTrace\u003cbr/>\u003cbr/>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。\u003cbr/>\u003ca href=\"https://shouyulove.cn/signtrace/\" target=\"_blank\" rel=\"noopener noreferrer\">进入以手寻语 SignTrace\u003c/a>\u003cbr/>设计者：涂增基 朱星晔 王宁静 黄庭逸",null,"center-right","medium","default",null,{"type":1681,"text1":1682,"text2":1683,"align":1684,"text1Size":1685,"text1Layout":1686,"titleSection":1687},"text","分社手语词典\u003cbr/>\u003cbr/>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。\u003cbr/>\u003ca href=\"https://shouyulove.cn/dict\" target=\"_blank\" rel=\"noopener noreferrer\">进入分社手语词典\u003c/a>\u003cbr/>设计者：朱星晔",null,"center-left","medium","default",null,{"type":1689,"text1":1690,"text2":1691,"align":1692,"text1Size":1693,"text1Layout":1694,"titleSection":1695},"text","手小语\u003cbr/>\u003cbr/>常驻手语分社微信群的陪伴伙伴，日常陪大家聊天水群、接梗斗图，空闲时也一起玩看图猜手语。\u003cbr/>\u003ca href=\"https://shouyulove.cn/shouxiaoyu/\" target=\"_blank\" rel=\"noopener noreferrer\">认识手小语\u003c/a>\u003cbr/>设计者：涂增基",null,"center-right","medium","default",null,{"type":1697,"text1":1698,"text2":1699,"align":1700,"text1Size":1701,"text1Layout":1702,"titleSection":1703},"text","2026 手语文化节\u003cbr/>\u003cbr/>服务于 2026 年手语文化节的小游戏网页～\u003cbr/>\u003ca href=\"https://shouyulove.cn/2026-sign-language-cultural-festival/\" target=\"_blank\" rel=\"noopener noreferrer\">打开2026 手语文化节\u003c/a>\u003cbr/>设计者：周丽敏 涂增基 黄庭逸",null,"center-left","medium","default",null,{"type":1705,"text1":1706,"text2":1707,"align":1708,"text1Size":1709,"text1Layout":1710,"titleSection":1711},"text","2026 手语分社骨干年终总结\u003cbr/>\u003cbr/>为 22 届骨干们献上的年终总结，这一年你们辛苦了！\u003cbr/>\u003ca href=\"https://shouyulove.cn/2026-year-end-summary/\" target=\"_blank\" rel=\"noopener noreferrer\">进入 2026 手语分社骨干年终总结\u003c/a>\u003cbr/>设计者：涂增基 黄庭逸 潘婧欣 王宁静 叶子涵",null,"center-right","medium","default",null,{"type":1713,"title":1714,"slug":1715,"uri":1716,"url":1717,"loaded":1718,"loading":1719,"metas":1720,"sceneIndex":1721,"blocks":1722},"about-detail","其他作品","awards","the-studio/awards","/the-studio/awards/",true,false,null,4,[1723,1731,1739,1747,1755],{"type":1724,"text1":1725,"text2":1726,"align":1727,"text1Size":1728,"text1Layout":1729,"titleSection":1730},"text","心创组成员为北大同学开发的实用工具，让校园学习与生活更方便。",null,"center-left","medium","default",null,{"type":1732,"text1":1733,"text2":1734,"align":1735,"text1Size":1736,"text1Layout":1737,"titleSection":1738},"text","去哪自习\u003cbr/>\u003cbr/>查询空闲教室，按时间和教学楼安排自习。\u003cbr/>\u003ca href=\"https://shouyulove.cn/where-to-study/\" target=\"_blank\" rel=\"noopener noreferrer\">进入去哪自习\u003c/a>\u003cbr/>设计者：王宁静",null,"center-right","medium","default",null,{"type":1740,"text1":1741,"text2":1742,"align":1743,"text1Size":1744,"text1Layout":1745,"titleSection":1746},"text","拼好课\u003cbr/>\u003cbr/>搜索和筛选北大课程，查看课程详情，收藏感兴趣的课程，并整理、导出自己的课表。\u003cbr/>\u003ca href=\"https://pinhaoke.love\" target=\"_blank\" rel=\"noopener noreferrer\">打开拼好课\u003c/a>\u003cbr/>设计者：涂增基",null,"center-left","medium","default",null,{"type":1748,"text1":1749,"text2":1750,"align":1751,"text1Size":1752,"text1Layout":1753,"titleSection":1754},"text","北大知道 PKU Know\u003cbr/>\u003cbr/>为你消除信息差，第一时间一站式了解北大的所有动态。\u003cbr/>\u003ca href=\"https://pkuknow.cn\" target=\"_blank\" rel=\"noopener noreferrer\">打开北大知道 PKU Know\u003c/a>\u003cbr/>设计者：涂增基",null,"center-right","medium","default",null,{"type":1756,"text1":1757,"text2":1758,"align":1759,"text1Size":1760,"text1Layout":1761,"titleSection":1762},"text","清华知道 THU Know\u003cbr/>\u003cbr/>为你消除信息差，第一时间一站式了解清华的所有动态。\u003cbr/>\u003ca href=\"https://pkuknow.cn/thu\" target=\"_blank\" rel=\"noopener noreferrer\">打开清华知道 THU Know\u003c/a>\u003cbr/>设计者：涂增基",null,"center-left","medium","default",null,{"type":1764,"title":1765,"slug":1766,"uri":1767,"url":1768,"loaded":1769,"loading":1770,"metas":1771,"sceneIndex":1772,"blocks":1773},"about-detail","边界","clients","the-studio/clients","/the-studio/clients/",true,false,null,5,[1774,1782,1790],{"type":1775,"text1":1776,"text2":1777,"align":1778,"text1Size":1779,"text1Layout":1780,"titleSection":1781},"text","为手语分社，为无障碍事业服务。坚守公益本心。",null,"center-left","medium","default",null,{"type":1783,"text1":1784,"text2":1785,"align":1786,"text1Size":1787,"text1Layout":1788,"titleSection":1789},"text","对他人创作 / 知识产权负责。不擅自把他人的原创内容投喂给 AI 做训练、改写或风格模仿",null,"center-right","medium","default",null,{"type":1791,"text1":1792,"te
