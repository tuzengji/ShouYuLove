a=""><div data-v-0b3c665a=""><div data-v-0b3c665a="">0</div></div></div></div></div><div id="__nuxt"><noscript><style>#boot-loader{display:none}</style><main class="static-preview"><h1>以手予爱<br/>ShouYuLove</h1><p>我们是北京大学爱心社手语分社心创组</p><p>以手予爱 ShouYuLove 是我们心创组推出的作品系列名称，也是我们的追寻。</p><h2>梦想</h2><p>以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>愿景</h2><p>心创组致力于用人工智能技术服务手语分社与无障碍事业：让手语学习变得更有趣，让分社的知识与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>以手寻语 SignTrace</h2><p>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/signtrace/">进入以手寻语 SignTrace</a><p>设计者：涂增基 朱星晔 王宁静 黄庭逸</p><h2>分社手语词典</h2><p>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/dict">进入分社手语词典</a><p>设计者：朱星晔</p><h2>小爱同学的物资小屋</h2><p>爱心社物资与社办储物间管理系统。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/XiaoAi-Warm-Cabin/">进入小爱同学的物资小屋</a><p>设计者：黄庭逸</p><h2>手语视听说</h2><p>汇集电影片段、手语短片与手语对话的视频学习资料库，支持汉手逐句对照与按台词定位复看。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/shouyu-shitingshuo/">进入手语视听说</a><p>设计者：李昌昊</p><h2>手小语</h2><p>常驻手语分社微信群的陪伴伙伴，日常陪大家聊天水群、接梗斗图，空闲时也一起玩看图猜手语。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/shouxiaoyu/">认识手小语</a><p>设计者：涂增基</p><h2>2026 手语文化节</h2><p>服务于 2026 年手语文化节的小游戏网页～</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/2026-sign-language-cultural-festival/">打开2026 手语文化节</a><p>设计者：周丽敏 涂增基 黄庭逸</p><h2>2026 手语分社骨干年终总结</h2><p>为 22 届骨干们献上的年终总结，这一年你们辛苦了！</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/2026-year-end-summary/">进入 2026 手语分社骨干年终总结</a><p>设计者：涂增基 黄庭逸 潘婧欣 王宁静 叶子涵</p><h2>骷髅牌</h2><p>多人联机手语牌桌，用玫瑰和骷髅试探并放技能。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/skull/">进入骷髅牌</a><p>设计者：黄庭逸</p><h2>完美一餐</h2><p>手语点菜合作游戏，避开忌口凑出一桌爱吃的菜。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/perfectmenu/">进入完美一餐</a><p>设计者：黄雨琦</p><h2>奶家麻将</h2><p>玩奶麻需要经常点击屏幕，有助于锻炼手指灵活性，可以提高手语能力。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/NaiMahjong/">进入奶家麻将</a><p>设计者：王宁静</p><h2>指间趣游 SignPlay</h2><p>手语小游戏手册，按场景和难度查玩法和资料。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/signplay/">进入指间趣游</a><p>设计者：伍家阳</p><h2>飞手传书</h2><p>比划猜词的共享题库，可分类抽题也能一起加词。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/flyinghands/">进入飞手传书</a><p>设计者：王宁静</p><h2>传情会意-手语版</h2><p>和伙伴轮流比划猜词，按难度练手语表达。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/chuanqinghuiyi/">开始传情会意</a><p>设计者：涂增基</p><h2>炸飞机</h2><p>两队藏好飞机，轮流打手语报坐标找机头。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/bombplane/">进入炸飞机</a><p>设计者：伍家阳</p><h2>水果炸弹</h2><p>轮流打蔬果手语算颜色，触发隐藏技能。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/fruitbomb/">进入水果炸弹</a><p>设计者：伍家阳</p><h2>巴巴爸爸</h2><p>配节奏视频的现场主持台，用来分组闯关猜身份。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/barbapapa/">进入巴巴爸爸</a><p>设计者：伍家阳</p><h2>行动代号</h2><p>手语版 Codenames，两队按组长手语线索猜词对抗。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/codenames/">进入行动代号</a><p>设计者：伍家阳</p><h2>雪豹凶杀案</h2><p>手语地图推理游戏，轮流查线索找真相。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/snowleopard/">进入雪豹凶杀案</a><p>设计者：伍家阳</p><h2>去哪自习</h2><p>查询空闲教室，按时间和教学楼安排自习。</p><a target="_blank" rel="noopener noreferrer" href="https://shouyulove.cn/where-to-study/">进入去哪自习</a><p>设计者：王宁静</p><h2>拼好课</h2><p>搜索和筛选北大课程，查看课程详情，收藏感兴趣的课程，并整理、导出自己的课表。</p><a target="_blank" rel="noopener noreferrer" href="https://pinhaoke.love">打开拼好课</a><p>设计者：涂增基</p><h2>北大知道 PKU Know</h2><p>为你消除信息差，第一时间一站式了解北大的所有动态。</p><a target="_blank" rel="noopener noreferrer" href="https://pkuknow.cn">打开北大知道 PKU Know</a><p>设计者：涂增基</p><h2>清华知道 THU Know</h2><p>为你消除信息差，第一时间一站式了解清华的所有动态。</p><a ta
