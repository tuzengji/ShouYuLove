与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>以手寻语 SignTrace</h2><p>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。</p><a href="https://shouyulove.cn/signtrace/" rel="noopener noreferrer" target="_blank">进入以手寻语 SignTrace</a><p>设计者：涂增基 朱星烨 王宁静 黄庭逸</p><h2>分社手语词典</h2><p>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。</p><a href="https://shouyulove.cn/dict" rel="noopener noreferrer" target="_blank">进入分社手语词典</a><p>设计者：朱星烨 涂增基</p><h2>传情绘意-手语版</h2><p>和伙伴轮流比划、猜词，通过不同难度的题目练习手语表达，让学习与社团活动更有趣。</p><a href="https://shouyulove.cn/chuanqinghuiyi/" rel="noopener noreferrer" target="_blank">开始传情绘意</a><p>设计者：涂增基</p><h2>拼好课</h2><p>搜索和筛选北大课程，查看课程详情，收藏感兴趣的课程，并整理、导出自己的课表。</p><a href="https://pinhaoke.love" rel="noopener noreferrer" target="_blank">打开拼好课</a><p>设计者：涂增基</p><h2>北大知道 PKU Know</h2><p>为你消除信息差，第一时间一站式了解北大的所有动态。</p><a href="https://pkuknow.cn/" rel="noopener noreferrer" target="_blank">打开北大知道 PKU Know</a><p>设计者：涂增基</p><h2>清华知道 THU Know</h2><p>为你消除信息差，第一时间一站式了解清华的所有动态。</p><a href="https://pkuknow.cn/thu" rel="noopener noreferrer" target="_blank">打开清华知道 THU Know</a><p>设计者：涂增基</p><h2>边界</h2><p>为手语分社，为无障碍事业服务。坚守公益本心。</p><p>对他人创作 / 知识产权负责。不擅自把他人的原创内容投喂给 AI 做训练、改写或风格模仿</p><p>对隐私 / 数据安全负责。对数据进行脱敏后使用和发布。</p><h2>心创组第一届成员</h2><p>涂增基　朱星晔　王宁静　黄庭逸　刘思昊　张志成　黄雨琦　伍家阳　王可遇　张诗茵　李咏翼　曹前走</p></main></noscript></div><script data-ssr="true" id="__NUXT_DATA__" type="application/json">[{"state":1,"once":3,"_errors":4,"serverRendered":7,"path":8,"pinia":9,"prerenderedAt":997,"data":998},["Reactive",2],{},["Set"],["Reactive",5],{"en_home":6},null,false,"/",{"transition":10,"ui":36,"webgl":89,"datas":109,"scroll":985},{"pageTransitions":11,"layoutTransitions":12,"cancelCallbacks":13,"meta":16,"transitionState":35},["Map"],["Map"],{"page":14,"layout":15},null,null,{"from":17,"to":26},{"fullPath":18,"path":19,"hash":20,"name":21,"params":22,"meta":23,"href":25},"/","/","","index",{},{"layout":24},"default","/",{"fullPath":27,"path":28,"hash":
