"introLoader__scrollDown" data-v-0b3c665a=""><div data-v-0b3c665a=""><div data-v-0b3c665a="">0</div></div></div></div></div><div id="__nuxt"><noscript><style>#boot-loader{display:none}</style><main class="static-preview"><h1>以手予爱<br/>ShouYuLove</h1><p>我们是北京大学爱心社手语分社心创组</p><p>以手予爱 ShouYuLove 是我们心创组推出的作品系列名称，也是我们的追寻。</p><h2>梦想</h2><p>以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>愿景</h2><p>心创组致力于用人工智能技术服务手语分社与无障碍事业：让手语学习变得更有趣，让分社的知识与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。</p><h2>以手寻语 SignTrace</h2><p>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。</p><a href="https://shouyulove.cn/signtrace/" rel="noopener noreferrer" target="_blank">进入以手寻语 SignTrace</a><p>设计者：涂增基 朱星晔 王宁静 黄庭逸</p><h2>分社手语词典</h2><p>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。</p><a href="https://shouyulove.cn/dict" rel="noopener noreferrer" target="_blank">进入分社手语词典</a><p>设计者：朱星晔</p><h2>传情会意-手语版</h2><p>和伙伴轮流比划、猜词，通过不同难度的题目练习手语表达，让学习与社团活动更有趣。</p><a href="https://shouyulove.cn/chuanqinghuiyi/" rel="noopener noreferrer" target="_blank">开始传情会意</a><p>设计者：涂增基</p><h2>指间趣游 SignPlay</h2><p>手语小游戏手册，按活动类型与难度查找玩法，并提供人数、时长和原始资料。</p><a href="https://shouyulove.cn/signplay/" rel="noopener noreferrer" target="_blank">进入指间趣游</a><p>设计者：伍家阳</p><h2>飞手传书</h2><p>为你比划我猜和传词游戏准备的共享素材库，支持分类选题、随机抽题、素材共建与导入导出。</p><a href="https://shouyulove.cn/flyinghands/" rel="noopener noreferrer" target="_blank">进入飞手传书</a><p>设计者：王宁静</p><h2>2026 手语文化节</h2><p>服务于 2026 年手语文化节的小游戏网页～</p><a href="https://shouyulove.cn/2026-sign-language-cultural-festival/" rel="noopener noreferrer" target="_blank">打开2026 手语文化节</a><p>设计者：周丽敏 涂增基 黄庭逸</p><h2>2026 手语分社骨干年终总结</h2><p>为 22 届骨干们献上的年终总结，这一年你们辛苦了！</p><a href="https://shouyulove.cn/2026-year-end-summary/" rel="noopener noreferrer" target="_blank">进入 2026 手语分社骨干年终总结</a><p>设计者：涂增基 黄庭逸 潘婧欣 王宁静 叶子涵</p><h2>去哪自习</h2><p>查询空闲教室，按时间和教学楼安排自习。</p><a href="https://39.96.206.228/" rel="noopener noreferrer" target="_blank">进入去哪自习</a><p>设计者：王宁静</p><h2>拼好课</h2><p>搜索和筛选北大课程，查看课程详情，收藏感兴趣的课程，并整理、导出自己的课表。</p><a href="https://pinhaoke.love" rel="noopener noreferrer" target="_blank">打开拼好课</a><p>设计者：涂增基</p><h2>北大知道 PKU Know</h2><p>为你消除信息差，第一时间一站式了解北大的所有动态。</p><a href="https://pkuknow.cn" rel="noopener noreferrer" target="_blank">打开北大知道 PKU Know</a><p>设计者：涂增基</p><h2>清华知道 THU Know</h2><p>为你消除信息差，第一时间一站式了解清华的所有动态。</p><a href="https://pkuknow.cn/thu" rel="noopener noreferrer" target="_blank">打开清华知道 THU Know</a><p>设计者：涂增基</p><h2>接锅</h2><p>发布项目，自由接锅，一起把想法做出来。</p><a href="https://shouyulove.cn/catchpot/" rel="noopener noreferrer" target="_blank">打开接锅</a><p>设计者：心创组</p><h2>边界</h2><p>为手语分社，为无障碍事业服务。坚守公益本心。</p><p>对他人创作 / 知识产权负责。不擅自把他人的原创内容投喂给 AI 做训练、改写或风格模仿</p><p>对隐私 / 数据安全负责。对数据进行脱敏后使用和发布。</p><h2>心创组第一届成员</h2><p>涂增基　朱星晔　王宁静　黄庭逸　李昌昊　刘思昊　张志成　黄雨琦　伍家阳　王可遇　张诗茵　李咏翼　曹前走</p></main></noscript></div><script data-ssr="true" id="__NUXT_DATA__" type="application/json">[{"state":1,"once":3,"_errors":4,"serverRendered":7,"path":8,"pinia":9,"prerenderedAt":1503,"data":1504},["Reactive",2],{},["Set"],["Reactive",5],{"en_home":6},null,false,"/",{"transition":10,"ui":36,"webgl":89,"datas":109,"scroll":1491},{"pageTransitions":11,"layoutTransitions":12,"cancelCallbacks":13,"meta":16,"transitionState":35},["Map"],["Map"],{"page":14,"layout":15},null,null,{"from":17,"to":26},{"fullPath":18,"path":19,"hash":20,"name":21,"params":22,"meta":23,"href":25},"/","/","","index",{},{"layout":24},"default","/",{"fullPath":27,"path":28,"hash":29,"name":30,"params":31,"meta":32,"href":34},"/","/","","index",{},{"layout":33},"default","/","none",{"isFirstRoute":37,"currentRoute":38,"previousRoute":39,"routesHistory":40,"previousRouteName":41,"mainLoader":42,"buttons":50,"bg":59,"windowSize":65,"debugParams":68,"popin":70,"audio":74,"cursor":76,"navButtonType":81,"isFooterInViewport":82,"isFooterBottomReached":83,"isInFastMode":84,"firstUserScroll":85,"uiHovered":86,"newsletterIsOpen":87,"introLoaderVisible":88},true,null,null,[],null,{"visible":43,"loaded":44,"progressComplete":45 locks":958},"about-detail","心创组","the-studio","the-studio/the-studio","/the-studio/the-studio/",true,false,null,1,[959,967,975],{"type":960,"text1":961,"text2":962,"align":963,"text1Size":964,"text1Layout":965,"titleSection":966},"text","我们是北京大学爱心社手语分社心创组",null,"center-left","medium","default",null,{"type":968,"text1":969,"text2":970,"align":971,"text1Size":972,"text1Layout":973,"titleSection":974},"text","以手予爱 ShouYuLove 是我们心创组推出的作品系列名称，也是我们的追寻。",null,"center-right","medium","default",null,{"type":976,"text1":977,"text2":978,"align":979,"text1Size":980,"text1Layout":981,"titleSection":982},"text","愿景\u003cbr/>\u003cbr/>心创组致力于用人工智能技术服务手语分社与无障碍事业：让手语学习变得更有趣，让分社的知识与记忆被好好安放，让繁复的社务变得轻盈，也承接其他各部组的奇思妙想的实现；我们还期望与公益伙伴携手开发更具影响力的项目，进行学术创新，探索无障碍事业的更多可能。在这里，技术门槛被降到最低，我们以手予爱，用心创造。让每一个好的想法，都抵达需要的人。",null,"center-left","medium","default",null,{"type":984,"title":985,"slug":986,"uri":987,"url":988,"loaded":989,"loading":990,"metas":991,"sceneIndex":992,"blocks":993},"about-detail","梦想","our-approach","the-studio/our-approach","/the-studio/our-approach/",true,false,null,2,[994],{"type":995,"text1":996,"text2":997,"align":998,"text1Size":999,"text1Layout":1000,"titleSection":1001},"text","以手予爱，用心创造。让每一个好的想法，都抵达需要的人。",null,"center-left","medium","default",null,{"type":1003,"title":1004,"slug":1005,"uri":1006,"url":1007,"loaded":1008,"loading":1009,"metas":1010,"sceneIndex":1011,"blocks":1012},"about-detail","核心创意","services","the-studio/services","/the-studio/services/",true,false,null,3,[1013,1021,1029,1037,1045,1053,1061,1069],{"type":1014,"text1":1015,"text2":1016,"align":1017,"text1Size":1018,"text1Layout":1019,"titleSection":1020},"text","围绕手语学习与表达，探索常用工具、互动游戏和无障碍交流。",null,"center-left","medium","default",null,{"type":1022,"text1":1023,"text2":1024,"align":1025,"text1Size":1026,"text1Layout":1027,"titleSection":1028},"text","以手寻语 SignTrace\u003cbr/>\u003cbr/>用自然语言描述你看到的手语动作，寻找对应词义；也可以输入词语，查询手语表达。\u003cbr/>\u003ca href=\"https://shouyulove.cn/signtrace/\" target=\"_blank\" rel=\"noopener noreferrer\">进入以手寻语 SignTrace\u003c/a>\u003cbr/>设计者：涂增基 朱星晔 王宁静 黄庭逸",null,"center-right","medium","default",null,{"type":1030,"text1":1031,"text2":1032,"align":1033,"text1Size":1034,"text1Layout":1035,"titleSection":1036},"text","分社手语词典\u003cbr/>\u003cbr/>面向分社内部学习的国家通用手语词典，支持按词语或动作检索，帮助查阅和复习手语表达。\u003cbr/>\u003ca href=\"https://shouyulove.cn/dict\" target=\"_blank\" rel=\"noopener noreferrer\">进入分社手语词典\u003c/a>\u003cbr/>设计者：朱星晔",null,"center-left","medium","default",null,{"type":1038,"text1":1039,"text2":1040,"align":1041,"text1Size":1042,"text1Layout":1043,"titleSection":1044},"text","传情会意-手语版\u003cbr/>\u003cbr/>和伙伴轮流比划、猜词，通过不同难度的题目练习手语表达，让学习与社团活动更有趣。\u003cbr/>\u003ca href=\"https://shouyulove.cn/chuanqinghuiyi/\" target=\"_blank\" rel=\"noopener noreferrer\">开始传情会意\u003c/a>\u003cbr/>设计者：涂增基",null,"center-right","medium","default",null,{"type":1046,"text1":1047,"text2":1048,"align":1049,"text1Size":1050,"text1Layout":1051,"titleSection":1052},"text","指间趣游 SignPlay\u003cbr/>\u003cbr/>手语小游戏手册，按活动类型与难度查找玩法，并提供人数、时长和原始资料。\u003cbr/>\u003ca href=\"https://shouyulove.cn/signplay/\" target=\"_blank\" rel=\"noopener noreferrer\">进入指间趣游\u003c/a>\u003cbr/>设计者：伍家阳",null,"center-left","medium","default",null,{"type":1054,"text1":1055,"text2":1056,"align":1057,"text1Size":1058,"text1Layout":1059,"titleSection":1060},"text","飞手传书\u003cbr/>\u003cbr/>为你比划我猜和传词游戏准备的共享素材库，支持分类选题、随机抽题、素材共建与导入导出。\u003cbr/>\u003ca href=\"https://shouyulove.cn/flyinghands/\" target=\"_blank\" rel=\"noopener noreferrer\">进入飞手传书\u003c/a>\u003cbr/>设计者：王宁静",null,"center-right","medium","default",null,{"type":1062,"text1":1063,"text2":1064,"align":1065,"text1Size":1066,"text1Layout":1067,"titleSection":1068},"text","2026 手语文化节\u003cbr/>\u003cbr/>服务于 2026 年手语文化节的小游戏网页～\u003cbr/>\u003ca href=\"https://shouyulove.cn/2026-sign-language-cultural-festival/\" target=\"_blank\" rel=\"noopener noreferrer\">打开2026 手语文化节\u003c/a>\u003cbr/>设计者：周丽敏 涂增基 黄庭逸",null,"center-left","medium","default",null,{"type":1070,"t
