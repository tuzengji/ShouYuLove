# Keep the captured frontend asset burst within the legacy HTTP/2 scheduler.
http2_max_concurrent_streams 32;

# Long cache is safe only for immutable, versioned public runtime files.
set $syl_static_cache "public, max-age=3600";
if ($uri ~* "\.(syl-v[0-9A-Za-z._-]+|[A-Za-z0-9_-]{8,})\.(js|css|woff2?|png|webp|ktx2|glb|json|mp3)$") {
    set $syl_static_cache "public, max-age=31536000, immutable";
}

# Included only inside the existing shouyulove.cn server block.
# Astra frontend; existing subsite locations stay in the parent configuration.

location = / {
    root /var/www/shouyulove-home;
    try_files /index.html =404;
    charset utf-8;
    gzip on;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
}

location = /projects { return 308 /projects/$is_args$args; }
location ^~ /projects/ {
    root /var/www/shouyulove-home;
    index index.html;
    try_files $uri $uri/ =404;
    charset utf-8;
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
}

location = /the-studio { return 308 /the-studio/$is_args$args; }
location ^~ /the-studio/ {
    root /var/www/shouyulove-home;
    index index.html;
    try_files $uri $uri/ =404;
    charset utf-8;
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
}

location = /_payload.json {
    root /var/www/shouyulove-home;
    try_files $uri =404;
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache";
}

location ^~ /assets/ {
    root /var/www/shouyulove-home;
    try_files $uri =404;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    expires off;
    add_header Cache-Control $syl_static_cache;
}

location ^~ /sites/immersive-g-com-955afd14/ {
    root /var/www/shouyulove-home;
    try_files $uri =404;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    expires off;
    add_header Cache-Control $syl_static_cache;
}

location ^~ /webgl/ {
    root /var/www/shouyulove-home;
    try_files $uri =404;
