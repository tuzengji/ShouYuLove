# Active snippet: /etc/nginx/snippets/shouyulove-home.conf.
# It is included once inside the existing shouyulove.cn server block.
# /var/www/shouyulove-home points to the current public release.
# Preserve the existing /signtrace/, /chuanqinghuiyi/ and /dict routes.
# This is an include snippet, not a complete nginx configuration.

location = / {
    root /var/www/shouyulove-home;
    try_files /index.html =404;
    charset utf-8;
    gzip on;
    add_header Cache-Control "no-cache";
}

location ^~ /home-assets/ {
    root /var/www/shouyulove-home;
    try_files $uri =404;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
    expires 1h;
}
