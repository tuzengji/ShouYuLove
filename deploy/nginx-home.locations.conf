location = /api/local-newsletter {
    default_type application/json;
    return 503 '{"message":"Newsletter subscriptions are unavailable in this local preview."}';
}

# Retired homepage files and collection pages are no longer public.
location ^~ /home-assets/ { return 404; }
location = /sign-projects { return 404; }
location ^~ /sign-projects/ { return 404; }
location = /campus { return 404; }
location ^~ /campus/ { return 404; }
