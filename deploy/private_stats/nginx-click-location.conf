# Write-only portfolio activation receiver. Counts are available only over SSH.
location ^~ /__syl/portfolio-click/ {
    if ($request_method != POST) { return 405; }
    if ($syl_click_project = "") { return 404; }
    if ($syl_click_same_origin = 0) { return 403; }
    if ($syl_click_source = 0) { return 403; }
    client_max_body_size 1k;
    add_header Cache-Control "no-store" always;
    return 204;
}
