# Included at http scope. Requests are sent to an owner-only local collector.
log_format syl_private_visits escape=json
  '{"time":"$time_iso8601","address":"$remote_addr","path":"$uri",'
  '"method":"$request_method","status":$status,"ua":"$http_user_agent"}';

# Only successful main-site HTML requests, excluding assets, APIs and redirects.
map "$request_method:$status:$uri" $syl_visit_html {
    default 0;
    ~^GET:(200|304):/(index\.html)?$ 1;
    ~^GET:(200|304):/portfolio/(index\.html)?$ 1;
    ~^GET:(200|304):/the-studio/(index\.html)?$ 1;
    ~^GET:(200|304):/(projects|the-studio)/[a-z0-9-]+/(index\.html)?$ 1;
}
