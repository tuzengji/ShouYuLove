# ShouYuLove 反爬第一道：每 IP 限速与并发上限（2026-08-27 加）
# 主力在应用层（signmate/antiscrape.py：页面令牌 + 覆盖度 + 连号检测 + 蜜罐），
# 这里只在更外围削峰——让批量抓取在进 Python 之前就被压到人类速度。
# rate=10r/s + burst=120 的依据：一次正常页面加载最多 = HTML + 8 个静态资源 +
# 若干接口 + 60 张线描图（lazy 加载），一百出头，真人一次到不了 120；
# 爬虫被削到 10 次/秒后，应用层的每分钟上限（图片 150/分钟）随即接管。
limit_req_zone  $binary_remote_addr zone=syl_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=syl_conn:10m;
