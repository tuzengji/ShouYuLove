# Included at http scope. Keep original routes and remove query strings before logging.
map $request_uri $syl_visit_path {
    ~^(?<syl_visit_original_path>[^?]*) $syl_visit_original_path;
    default "";
}

log_format syl_private_visits escape=json
  '{"time":"$time_iso8601","address":"$remote_addr","host":"$host",'
  '"path":"$syl_visit_path","resolved_path":"$uri",'
  '"kind":"$syl_event_kind","project":"$syl_click_project",'
  '"portfolio_source":"$syl_click_source","same_origin":"$syl_click_same_origin",'
  '"method":"$request_method","status":$status,"ua":"$http_user_agent",'
  '"content_type":"$sent_http_content_type","upstream_type":"$upstream_http_content_type",'
  '"destination":"$http_sec_fetch_dest","accept":"$http_accept",'
  '"purpose":"$http_purpose","sec_purpose":"$http_sec_purpose"}';

# Successful HTML responses across all current/future routes. The collector also
# checks document destinations, prefetch requests and bots. 304 can omit MIME type.
map "$request_method:$status:$sent_http_content_type" $syl_visit_html {
    default 0;
    "~*^GET:200:(text/html|application/xhtml\+xml)(;|$)" 1;
    ~^GET:304: 1;
}

# The browser sends a bodyless POST while the original link opens normally.
map $uri $syl_click_project {
    default "";
    "~^/__syl/portfolio-click/(?<syl_click_id>[a-z0-9][a-z0-9-]{0,79})$" $syl_click_id;
}
map "$host:$http_origin" $syl_click_same_origin {
    default 0;
    "shouyulove.cn:https://shouyulove.cn" 1;
    "www.shouyulove.cn:https://www.shouyulove.cn" 1;
}
map $http_referer $syl_click_source {
    default 0;
    "~^https://(www\.)?shouyulove\.cn/portfolio/(index\.html)?(\?.*)?$" 1;
}
map "$request_method:$status:$syl_click_source:$syl_click_same_origin:$syl_click_project" $syl_portfolio_click {
    default 0;
    "~^POST:204:1:1:[a-z0-9][a-z0-9-]*$" 1;
}
map $syl_portfolio_click $syl_event_kind {
    default page;
    1 portfolio_click;
}
map "$syl_visit_html:$syl_portfolio_click" $syl_collect_event {
    default 0;
    ~^1: 1;
    ~:1$ 1;
}
