# Request timing only: no client addresses, cookies, query strings or user agents.
# Keep the original combined logs unchanged for existing private-report readers.
map $syl_visit_path $syl_diagnostic_route {
    default /other;
    / /;
    ~^/dict/(?<syl_diag_dict>static|sign-image|inline-image|ai-video|video-files|entries|entry)(/|$) /dict/$syl_diag_dict;
    ~^/dict/ /dict/other;
    ~^/2026-year-end-summary/api/login$ /2026-year-end-summary/api/login;
    ~^/signtrace/api/job/ /signtrace/api/job;
    ~^/api/job/ /signtrace/api/job;
    ~^/(?<syl_diag_group>portfolio|projects|the-studio|assets|sites|webgl|images|lotties|sounds|signtrace|signplay|catchpot|2026-sign-language-cultural-festival|2026-year-end-summary|shouyu|loveheart)(/|$) /$syl_diag_group;
}

log_format syl_diagnostics escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"route":"$syl_diagnostic_route","method":"$request_method",'
    '"status":$status,"bytes":$body_bytes_sent,"request_seconds":$request_time,'
    '"upstream_status":"$upstream_status","upstream_connect":"$upstream_connect_time",'
    '"upstream_header":"$upstream_header_time","upstream_seconds":"$upstream_response_time",'
    '"request_limit":"$limit_req_status","connection_limit":"$limit_conn_status",'
    '"dictionary_guard":"$syl_dict_reason","complete":"$request_completion","protocol":"$server_protocol"}';
