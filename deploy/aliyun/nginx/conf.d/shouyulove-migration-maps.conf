# Recap sessions use the Aliyun service after the Tencent host is retired.
map "$cookie_syl_recap_origin:$cookie_recapSession" $syl_recap_existing_port {
    default 8042;
}
map $uri $syl_recap_port {
    default $syl_recap_existing_port;
    /api/login 8042;
    /2026-year-end-summary/api/login 8042;
}
map $syl_recap_port $syl_recap_marker {
    default "";
    8042 "syl_recap_origin=aliyun; Path=/2026-year-end-summary/; HttpOnly; Secure; SameSite=Strict; Max-Age=43200";
}
