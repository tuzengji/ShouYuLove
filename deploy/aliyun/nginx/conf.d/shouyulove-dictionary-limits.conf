# Only a correctly signed, unexpired dictionary cookie becomes a quota key.
map $cookie_syl_dict_session $syl_dict_sid {
    default "";
    "~^(?<syl_sid>[a-f0-9]{32})\.[0-9]{10}\.[A-Za-z0-9_-]{22}$" $syl_sid;
}
map $cookie_syl_dict_session $syl_dict_expires {
    default "";
    "~^[a-f0-9]{32}\.(?<syl_exp>[0-9]{10})\.[A-Za-z0-9_-]{22}$" $syl_exp;
}
map $cookie_syl_dict_session $syl_dict_signature {
    default "";
    "~^[a-f0-9]{32}\.[0-9]{10}\.(?<syl_sig>[A-Za-z0-9_-]{22})$" $syl_sig;
}
map $secure_link $syl_dict_session_key {
    default "";
    1 $syl_dict_sid;
}
map $syl_dict_retry $syl_dict_retry_after { default $syl_dict_retry; "" 5; }
limit_req_zone $syl_dict_session_key zone=syl_dict_session_req:10m rate=10r/s;
limit_conn_zone $syl_dict_session_key zone=syl_dict_session_conn:10m;
# Shared campus NAT backstop, separate from every other project's zones.
limit_req_zone $binary_remote_addr zone=syl_dict_ip_req:10m rate=1000r/s;
limit_conn_zone $binary_remote_addr zone=syl_dict_ip_conn:10m;
limit_conn_zone $server_name zone=syl_dict_project_conn:1m;

# Login and paid-query starts have a separate, stricter budget. Cancellation and
# ordinary image/search requests do not spend these tokens.
map "$request_method:$uri" $syl_dict_sensitive_session {
    default "";
    ~^POST:/dict/(api/structured-action-search|admin/api/structured-action-evaluation/score|admin/login|teaching/topics/auth)$ $syl_dict_session_key;
}
map "$request_method:$uri" $syl_dict_sensitive_ip {
    default "";
    ~^POST:/dict/(api/structured-action-search|admin/api/structured-action-evaluation/score|admin/login|teaching/topics/auth)$ $binary_remote_addr;
}
map $syl_dict_sensitive_ip $syl_dict_sensitive_project { "" ""; default $server_name; }
limit_req_zone $syl_dict_sensitive_session zone=syl_dict_sensitive_req:1m rate=1r/s;
limit_req_zone $syl_dict_sensitive_ip zone=syl_dict_sensitive_ip_req:1m rate=10r/s;
limit_conn_zone $syl_dict_sensitive_session zone=syl_dict_sensitive_conn:1m;
limit_conn_zone $syl_dict_sensitive_project zone=syl_dict_sensitive_total:1m;
