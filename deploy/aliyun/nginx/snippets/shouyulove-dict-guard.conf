secure_link $syl_dict_signature,$syl_dict_expires;
# Generated on the server, root-only; never commit its random signing secret.
include /etc/shouyulove/dict-guard-signing.conf;

location = /_syl_dict_guard {
    internal;
    proxy_pass http://unix:/run/shouyulove-dict-guard/guard.sock:/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $syl_dict_original_uri;
    proxy_set_header X-Original-Method $syl_dict_original_method;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_cache off;
}

# Run the new guard before the existing, independent content permission check.
location = /_syl_dict_video_access {
    internal;
    auth_request /_syl_dict_guard;
    auth_request_set $syl_video_cookie $upstream_http_set_cookie;
    auth_request_set $syl_video_reason $upstream_http_x_syl_guard_reason;
    auth_request_set $syl_video_retry $upstream_http_retry_after;
    add_header Set-Cookie $syl_video_cookie always;
    add_header X-Syl-Guard-Reason $syl_video_reason always;
    add_header Retry-After $syl_video_retry always;
    proxy_pass http://shouyu_dict_backend/internal/content-access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cookie "";
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
}

location @syl_dict_limited {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header Retry-After $syl_dict_retry_after always;
    return 429 "访问过于频繁，请稍候再试。若直接打开图片或视频，请先打开词典页面。\n";
}
