# Included inside the existing shouyulove.cn server block.
# Five static sign-language game consoles under /var/www/shouyulove-sign-games.
location = /bombplane { return 308 /bombplane/$is_args$args; }
location = /bombplane/host { return 308 /bombplane/host/$is_args$args; }
location = /bombplane/player { return 308 /bombplane/player/$is_args$args; }
location ^~ /bombplane/ {
    root /var/www/shouyulove-sign-games;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Robots-Tag "noindex, nofollow";
}

