# Included inside the existing shouyulove.cn server block.
location = /signplay { return 308 /signplay/$is_args$args; }
location ^~ /signplay/ {
    alias /var/www/shouyulove-signplay/;
    index index.html;
    autoindex off;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}
