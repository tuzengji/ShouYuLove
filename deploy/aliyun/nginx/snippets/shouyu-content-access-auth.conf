# Include inside shouyulove.cn's public server when preparing the video gate.
# Both primary (clab logging hop) and local fallback must trust their loopback
# Nginx peers, keep the same mode, and use the verified visitor X-Real-IP.
location = /_shouyu_content_access {
    internal;
    proxy_pass http://shouyu_dict_backend/internal/content-access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cookie "";
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
}

# Authorization is available only through the internal subrequest above.
location = /dict/internal/content-access {
    return 404;
}
