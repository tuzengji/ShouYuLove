location = /2026-year-end-summary {
    return 308 https://shouyulove.cn/2026-year-end-summary/$is_args$args;
}
location ^~ /2026-year-end-summary/ {
    if ($scheme = http) { return 308 https://shouyulove.cn$request_uri; }
    rewrite ^/2026-year-end-summary/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:$syl_recap_port;
    add_header Set-Cookie $syl_recap_marker always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8k;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
