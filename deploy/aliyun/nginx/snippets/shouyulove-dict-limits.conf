limit_req zone=syl_dict_session_req burst=120 nodelay;
limit_req zone=syl_dict_ip_req burst=12000 nodelay;
limit_req zone=syl_dict_sensitive_req burst=5 nodelay;
limit_req zone=syl_dict_sensitive_ip_req burst=120 nodelay;
limit_conn syl_dict_session_conn 64;
limit_conn syl_dict_ip_conn 4096;
limit_conn syl_dict_project_conn 8192;
limit_conn syl_dict_sensitive_conn 2;
limit_conn syl_dict_sensitive_total 128;
set $syl_dict_original_method $request_method;
set $syl_dict_original_uri $uri;
auth_request_set $syl_dict_cookie $upstream_http_set_cookie;
auth_request_set $syl_dict_reason $upstream_http_x_syl_guard_reason;
auth_request_set $syl_dict_retry $upstream_http_retry_after;
add_header Set-Cookie $syl_dict_cookie always;
error_page 401 = @syl_dict_limited;
error_page 429 = @syl_dict_limited;
