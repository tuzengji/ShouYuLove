# Included inside the existing shouyulove.cn server block.
# External partner entry for NaiMahjong (奶家麻将, http://39.96.206.228:8444/).
location = /NaiMahjong {
    add_header Cache-Control "no-store" always;
    return 302 http://39.96.206.228:8444/$is_args$args;
}
location = /NaiMahjong/ {
    add_header Cache-Control "no-store" always;
    return 302 http://39.96.206.228:8444/$is_args$args;
}
location ~* ^/naimahjong/?$ {
    add_header Cache-Control "no-store" always;
    return 302 /NaiMahjong/$is_args$args;
}
location ~* ^/naimahjong/(?<naimahjong_rest>.+)$ {
    add_header Cache-Control "no-store" always;
    return 302 http://39.96.206.228:8444/$naimahjong_rest$is_args$args;
}
