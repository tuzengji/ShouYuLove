# OPT-IN ONLY: include INSIDE every protected video location, including aliases.
# Include content-access-auth-location.conf in the containing public server.
# REMOVE existing public Cache-Control/expires directives in that location.
# For proxy locations, hide the upstream's cache policy as below.
auth_request /_shouyu_content_access;
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
expires off;
add_header Cache-Control "private, no-store" always;
