# Included only in the existing shouyulove.cn server block.
location = /jieguo { return 404; }
location ^~ /jieguo/ { return 404; }
location = /catchpot { return 308 https://shouyulove.cn/catchpot/$is_args$args; }
location ^~ /catchpot/ {
    if ($scheme = http) { return 308 https://shouyulove.cn$request_uri; }
    if ($host != shouyulove.cn) { return 308 https://shouyulove.cn$request_uri; }
    client_max_body_size 24k;
    proxy_pass http://127.0.0.1:8040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
