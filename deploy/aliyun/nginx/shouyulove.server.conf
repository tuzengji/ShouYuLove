# ShouYuLove（以手予爱）· 手语查询 —— shouyulove.cn → 本机 8018
# yanxun-pku 站点保持 default_server 不动：yanxun.fun 与 IP 直访仍走原配置。
server {
    listen 80;
    listen [::]:80;

    # HTTPS（2026-09-03 加）：复用 Let's Encrypt 的 shouyulove.cn 证书（certbot certonly --nginx 签发，
    # certbot.timer 每天两次自动续期，续期成功后由 renewal-hooks/deploy/reload-nginx.sh 重载 nginx）。
    # 80 照旧直接服务、不做跳转；同一 server 块同时监听 80 和 443，下面的反代规则只维护一份。
    # 不要加 Strict-Transport-Security：HSTS 按主机名生效、不分端口且会被浏览器长期记住，
    # 一旦下发，shouyulove.cn 的所有端口都必须永远有 https，要开请另行决定。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate     /etc/shouyulove/tls/fullchain.pem;
    ssl_certificate_key /etc/shouyulove/tls/privkey.pem;
    include /etc/shouyulove/tls/options-ssl-nginx.conf;
    ssl_dhparam /etc/shouyulove/tls/ssl-dhparams.pem;
    server_name shouyulove.cn www.shouyulove.cn;
    # The old entrance forwards during DNS propagation; only this IP is trusted.
    set_real_ip_from 49.232.193.175;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    limit_req_status 429;
    limit_conn_status 429;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/shouyulove-acme;
        default_type text/plain;
        try_files $uri =404;
    }


    include /etc/nginx/snippets/shouyulove-home.conf;
    include /etc/nginx/snippets/signplay.conf;
    include /etc/nginx/snippets/jieguo.conf;
    include /etc/nginx/snippets/sign-language-festival.conf;
    include /etc/nginx/snippets/sign-year-end-summary.conf;

    # 本站独立访问日志（2026-08-27 加）：两站原本共用 /var/log/nginx/access.log，
    # 默认 combined 格式不含 $host，GET / 无法归属到具体站点——应用层统计一旦再出
    # 问题（2026-08-21~27 就静默漏计了六天），没有可归属的日志就无法补数。
    # 两条 access_log 并列 = 纯增量：原共享日志照旧收本站的行，不影响任何既有消费方。
    # 格式保持 combined，scripts/rebuild_stats_from_nginx.py 的解析可直接复用。
    # logrotate 的 /var/log/nginx/*.log 规则已自动覆盖新文件。
    access_log /var/log/shouyulove-private/requests.jsonl syl_diagnostics buffer=32k flush=5s;
    access_log /var/log/nginx/shouyulove.access.log combined;
    access_log /var/log/nginx/access.log combined;

    # 传情绘意（以手绘意·手语猜词）子站 —— /chuanqinghuiyi/ → 本机 8019（服务仅监听回环）
    location = /chuanqinghuiyi { return 301 /chuanqinghuiyi/; }
    location /chuanqinghuiyi/ {
        proxy_pass http://127.0.0.1:8019/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 手语项目的独立子路径；根入口目前继续兼容，后续可单独替换。
    location = /signtrace { return 308 /signtrace/$is_args$args; }
    location ^~ /signtrace/ {
        limit_req zone=syl_req burst=120 nodelay;
        limit_conn syl_conn 24;
        # 末尾 / 去除上游请求中的 /signtrace/ 前缀。
        proxy_pass http://127.0.0.1:8018/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /signtrace;
        proxy_redirect / /signtrace/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Retired report URLs must not fall through to the root application.
    location = /secret/user_behavior { return 404; }
    location ^~ /secret/user_behavior/ { return 404; }

    # 国家通用手语词典；默认经反向隧道到 clab，隧道不可用时回退本机 8080。
    # Private reports run independently of the primary/fallback dictionary.
    location = /dict/reports { return 308 /dict/reports/$is_args$args; }
    location ^~ /dict/reports/ {
        proxy_pass http://127.0.0.1:8092/reports/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dict;
    }
    # location = /dict/static/style.css {
    #    alias /home/zhuxingye/projects/shouyu/web/static/style.css;
    # }

    location = /dict {
        return 308 /dict/entries$is_args$args;
    }

    location = /dict/ {
        return 308 /dict/entries$is_args$args;
    }

    # Keep the typo used in the original deployment request working.
    location = /dict/entires {
        return 308 /dict/entries$is_args$args;
    }

    include /etc/nginx/snippets/shouyu-content-access-auth.conf;
    include /etc/nginx/snippets/shouyulove-dict-guard.conf;

    # Video files are served by clab Nginx, not by the Python Web application.
    # Public UI assets only use the generous network/project backstops.
    location ^~ /dict/static/ {
        limit_req zone=syl_dict_ip_req burst=12000 nodelay;
        limit_conn syl_dict_ip_conn 4096;
        limit_conn syl_dict_project_conn 8192;
        proxy_pass http://shouyu_dict_backend/static/;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dict;
        proxy_set_header Connection "";
    }

    location ^~ /dict/video-files/ {
        include /etc/nginx/snippets/shouyulove-dict-video-guard.conf;
        include /etc/nginx/snippets/shouyulove-dict-limits.conf;
        alias /var/lib/shouyu/videos/;
        try_files $uri @shouyu_video_clab;
        types { video/mp4 mp4; }
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, no-store" always;
    }

    # A named location cannot use a URI suffix in proxy_pass.
    location @shouyu_video_clab {
        include /etc/nginx/snippets/shouyulove-dict-limits.conf;
        include /etc/nginx/snippets/shouyulove-dict-video-guard.conf;
        rewrite ^/dict/video-files/(.*)$ /shouyu_dict/video-files/$1 break;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    location ^~ /dict/ {
        auth_request /_syl_dict_guard;
        include /etc/nginx/snippets/shouyulove-dict-limits.conf;

        # The trailing slash removes /dict/ before forwarding to the Python app.
        proxy_pass http://shouyu_dict_backend/;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /dict;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The contact page links to these root-level BBS archives.
    location = /shouyu { return 308 /shouyu/; }
    location = /shouyu/ { return 302 /shouyu/html/index.html; }
    location ^~ /shouyu/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }

    location = /loveheart { return 308 /loveheart/; }
    location = /loveheart/ { return 302 /loveheart/html/index.html; }
    location ^~ /loveheart/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }

    location ^~ /signtrace/api/job/ {
        limit_req zone=syl_req burst=120 nodelay;
        limit_conn syl_conn 24;
        proxy_pass http://127.0.0.1:8018/api/job/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header X-Forwarded-Prefix "/signtrace";
        proxy_intercept_errors on;
        error_page 403 404 = @syl_legacy_job_signtrace;
    }
    location @syl_legacy_job_signtrace {
        rewrite ^/signtrace/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:28018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header X-Forwarded-Prefix "/signtrace";
    }
    location ^~ /api/job/ {
        limit_req zone=syl_req burst=120 nodelay;
        limit_conn syl_conn 24;
        proxy_pass http://127.0.0.1:8018/api/job/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_intercept_errors on;
        error_page 403 404 = @syl_legacy_job_root;
    }
    location @syl_legacy_job_root {
        proxy_pass http://127.0.0.1:28018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header X-Forwarded-Prefix "";
    }

    location / {
        # 反爬限速（2026-08-27 加，区在 conf.d/shouyulove-limits.conf）。
        # 放在 location / 内而非 server 级：limit_req 没有 off 开关，挂到 server 级
        # 会连带管住子站 /chuanqinghuiyi/ 的资源加载。
        limit_req  zone=syl_req burst=120 nodelay;
        limit_conn syl_conn 24;

        proxy_pass http://127.0.0.1:8018;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Shouyu-Report-Ingress syl;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 理解/高精度排序耗时可达数分钟（前端轮询为主，同步调试接口留足余量）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
