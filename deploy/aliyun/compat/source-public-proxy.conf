# Migration entrance: keep old-IP visitors on the same authoritative server.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shouyulove.cn www.shouyulove.cn;
    ssl_certificate /etc/letsencrypt/live/shouyulove.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shouyulove.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Private counts are collected once at the destination, with the real IP.
    access_log /var/log/nginx/shouyulove.access.log combined;
    access_log /var/log/nginx/access.log combined;
    location / {
        proxy_pass $scheme://101.37.209.227;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_ssl_server_name on;
        proxy_ssl_name shouyulove.cn;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
