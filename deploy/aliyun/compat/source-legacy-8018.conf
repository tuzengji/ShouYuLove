# Temporary compatibility entry for external requests to the old TCP 8018 port.
# PREROUTING redirects only eth0:8018 here; source loopback:8018 stays unchanged.
server {
    listen 10.2.0.12:18018;
    server_name _;
    access_log off;
    add_header X-ShouYuLove-Legacy-Relay aliyun-8018 always;

    proxy_http_version 1.1;
    proxy_set_header Host shouyulove.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection close;
    proxy_ssl_server_name on;
    proxy_ssl_name shouyulove.cn;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 8s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_redirect https://shouyulove.cn/signtrace/ /signtrace/;

    location = /signtrace { return 308 /signtrace/; }
    location ^~ /signtrace/ { proxy_pass https://101.37.209.227; }
    location / { proxy_pass https://101.37.209.227/signtrace/; }
}
