<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf5f2">
  <title>@@TITLE@@ · 以手予爱 ShouYuLove</title>
  <meta name="description" content="@@DESCRIPTION@@">
  <link rel="canonical" href="https://shouyulove.cn/@@PATH@@/">
  <meta property="og:title" content="@@TITLE@@ · 以手予爱 ShouYuLove">
  <meta property="og:description" content="@@DESCRIPTION@@">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shouyulove.cn/@@PATH@@/">
  <link rel="icon" type="image/png" href="../home-assets/images/favicon.png">
  <script>try{if(localStorage.getItem('signmate-theme')==='dark'){document.documentElement.dataset.theme='dark';document.querySelector('meta[name="theme-color"]').content='#1c211b';}}catch(_){}</script>
  <link rel="stylesheet" href="../home-assets/styles.css?v=collections-13">
  <script src="../home-assets/main.js?v=collections-13" defer></script>
</head>
<body id="top" class="catalog-page">
  <a class="skip-link" href="#projects">跳到作品列表</a>
  <header class="site-header">
    <a class="brand" href="../" aria-label="以手予爱 ShouYuLove，返回首页"><img src="../home-assets/images/brand-mark.webp" width="32" height="32" alt=""><span>以手予爱 ShouYuLove</span></a>
    <nav class="primary-nav" aria-label="主导航">@@NAV@@</nav>
  </header>
  <main id="main" class="catalog-main section-wrap">
    <header class="catalog-heading"><h1>@@TITLE@@</h1><p>@@DESCRIPTION@@</p></header>
    <section id="projects" aria-label="@@TITLE@@列表" tabindex="-1">
      <div class="project-tools" hidden><label class="search-field"><svg class="icon" aria-hidden="true"><use href="../home-assets/icons.svg#magnifying-glass"></use></svg><input id="project-search" type="search" placeholder="搜索名称、用途或创作者" aria-label="搜索作品" autocomplete="off"></label><div id="project-filters" class="project-filters" role="group" aria-label="按类别筛选作品"></div></div>
      <div class="project-list">@@PROJECTS@@</div>
      <div class="project-empty" hidden><button class="text-link" type="button" id="clear-search">没有匹配作品，清除筛选</button></div><p id="project-count" class="sr-only" aria-live="polite"></p>
    </section>
  </main>
  <footer class="site-footer catalog-footer"><div class="footer-top"><a class="catalog-home" href="../">以手予爱 ShouYuLove</a><a class="back-top text-link" href="#top">回到顶部<svg class="icon" aria-hidden="true"><use href="../home-assets/icons.svg#arrow-up-right"></use></svg></a></div><div class="footer-bottom"><button class="motion-toggle" type="button" aria-pressed="false" hidden>简洁浏览</button><button class="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false" hidden><svg class="icon theme-moon" aria-hidden="true"><use href="../home-assets/icons.svg#moon"></use></svg><svg class="icon theme-sun" aria-hidden="true"><use href="../home-assets/icons.svg#sun"></use></svg><span>切换到深色</span></button></div></footer>
</body>
</html>
