<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8e8e6">
  <meta name="color-scheme" content="light">
  <title>@@TITLE@@</title>
  <meta name="description" content="@@DESCRIPTION@@">
  <link rel="canonical" href="https://shouyulove.cn/@@PATH@@">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="@@TITLE@@">
  <meta property="og:description" content="@@DESCRIPTION@@">
  <meta property="og:url" content="https://shouyulove.cn/@@PATH@@">
  <link rel="icon" href="@@PREFIX@@home-assets/images/favicon.png">
  <link rel="apple-touch-icon" href="@@PREFIX@@home-assets/images/apple-touch-icon.png">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preload" href="@@PREFIX@@home-assets/fonts/noto-serif-sc-regular-subset.woff2?v=garden-22" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="@@PREFIX@@home-assets/fonts/pstimes-regular.woff2?v=garden-22" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="@@PREFIX@@home-assets/garden.css?v=garden-22">
  <script type="module" src="@@PREFIX@@home-assets/garden.bundle.js?v=garden-22"></script>
</head>
<body id="top" data-page="@@PAGE@@">
  <div class="site-loader" id="site-loader" role="status" aria-live="polite" aria-label="正在加载以手予爱">
    <div class="site-loader__inner">
      <div class="site-loader__brand display">以手予爱 <span lang="en">ShouYuLove</span></div>
      <div class="site-loader__progress"><span class="site-loader__fill" id="site-loader-fill"></span></div>
      <div class="site-loader__meta"><span>正在揭开花朵</span><span id="site-loader-value">0</span></div>
    </div>
  </div>
  <a class="skip-link" href="#content">跳到正文</a>
  <canvas id="garden" aria-hidden="true"></canvas>
  <div class="scene-fallback" aria-hidden="true"></div>
  <header class="site-header">
    <a class="corner-brand" href="@@PREFIX@@" aria-label="以手予爱 ShouYuLove，返回首页">以手予爱 <span lang="en">ShouYuLove</span></a>
    <nav class="primary-nav" aria-label="主导航">@@NAV@@</nav>
  </header>
  <main id="content" tabindex="-1">@@CONTENT@@</main>
  <footer class="site-footer" id="principles">
    <div class="footer-principles grid">
      <h2 class="footer-boundary-title">边界</h2>
      <ul class="principles">@@PRINCIPLES@@</ul>
      <div class="footer-meta"><span>北京大学爱心社手语分社心创组</span><a href="#top">返回顶部 ↑</a>@@CREDIT@@</div>
    </div>
    <div class="footer-black-stage" aria-label="以手予爱 ShouYuLove">
      <a class="footer-brand display" href="@@PREFIX@@">以手予爱 <span lang="en">ShouYuLove</span></a>
    </div>
  </footer>
  <div class="cursor" aria-hidden="true"><span>进入</span></div>
  <svg class="effect-defs" aria-hidden="true" width="0" height="0"><defs>
    <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".008 .012" numOctaves="2" seed="9" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="ink-splash" x="-35%" y="-90%" width="170%" height="280%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".014 .032" numOctaves="3" seed="17" result="ink-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="ink-noise" scale="30" xChannelSelector="R" yChannelSelector="G" result="ink-warp"/>
      <feGaussianBlur in="ink-warp" stdDeviation="5.5" result="ink-soft"/>
      <feColorMatrix in="ink-soft" type="matrix" values="0 0 0 0 .055 0 0 0 0 .065 0 0 0 0 .07 0 0 0 .86 0"/>
    </filter>
  </defs></svg>
</body>
</html>
